/* ===== Üben ===== */
let idkQueue=[];   // „Weiß ich nicht“: Frage kommt nach 3 anderen Fragen wieder, ohne Strafe
function nextPracticeQ(items, avoid){
  idkQueue.forEach(x=>x.wait--);
  const k=idkQueue.findIndex(x=>x.wait<=0 && items.some(i=>i.id===x.id) && x.id!==avoid);
  if(k>=0){ const id=idkQueue.splice(k,1)[0].id; return items.find(i=>i.id===id); }
  return weightedPick(items, avoid);
}
function renderPractice(){
  const all = allQ().filter(inFilter);
  const errs = all.filter(x=>state.err[x.id] && boxOf(x.id)<4);
  const items = state.errOnly ? errs : all;
  const head = `<div class="row"><h1 class="grow">Üben</h1>${filterSelect()}</div>
    <div class="row" style="margin:-4px 0 10px"><label class="small muted">Modus <select id="mode">
      <option value="0"${state.errOnly?"":" selected"}>Alle Fragen</option>
      <option value="1"${state.errOnly?" selected":""}>Nur meine Fehler (${errs.length})</option></select></label></div>`;
  const bindHead = () => { bindFilter(()=>{practice=null;renderPractice();}); $("#mode").onchange=e=>{ state.errOnly=e.target.value==="1"; practice=null; save(); renderPractice(); }; };
  if(!items.length){
    $("#app").innerHTML = head + (state.errOnly ? `<div class="block"><p>Keine offenen Fehler. Alles, was du falsch hattest, sitzt inzwischen sicher.</p></div>` : `<p>Für diese Auswahl gibt es noch keine Fragen.</p>`);
    bindHead(); return;
  }
  if(!practice || !items.find(x=>x.id===practice.p.q.id)){
    const last = items.find(x=>x.id===state.lastQ);
    practice = {p:prepQ(last || weightedPick(items)), ans:null, done:false, idk:false, before:null};
    state.lastQ = practice.p.q.id;
  }
  if(practice.before==null) practice.before = all.filter(x=>boxOf(x.id)>=2).length;
  const {p, ans, done, idk} = practice;
  const ses=sessions()[p.q.s];
  $("#app").innerHTML = head + `
    <p class="small muted">Zuletzt ${practice.before} von ${all.length} Fragen richtig. Falsche kommen öfter dran.</p>
    <div class="block">
      <p class="eyebrow">Sitzung ${esc(p.q.s)}${ses?": "+esc(ses):""}${typeHint(p)?" · "+typeHint(p):""}</p>
      <div class="q">${inl(p.q.q)}</div>
      ${answerHTML(p, ans, done, idk)}
      ${done ? fbHTML(p, ans, idk) + `<button class="btn" id="nextQ" style="margin-top:14px">Nächste Frage</button>`
      : `<div class="row" style="margin-top:12px">${p.t!=="sc" ? `<button class="btn" id="check"${isAnswered(p,ans)?"":" disabled"}>Prüfen</button>` : ""}<button class="btn ghost idk" id="idk">Weiß ich nicht</button></div>`}
    </div>`;
  bindHead();
  const check = () => { practice.done=true; const r=isRight(p,practice.ans); grade(p.q.id, r); track("od", r); save(); renderPractice(); };
  if(!done){
    bindAnswer(p, ()=>practice.ans, (a,instant,redraw)=>{
      practice.ans=a;
      if(instant && isAnswered(p,a)) return check();
      if(redraw) renderPractice(); else { const b=$("#check"); if(b) b.disabled=!isAnswered(p,a); }
    });
    const b=$("#check"); if(b) b.onclick=check;
    $("#idk").onclick=()=>{ practice.done=true; practice.idk=true; practice.ans=null; idkQueue.push({id:p.q.id, wait:3}); track("od"); logDay(Date.now()).x=(logDay(Date.now()).x||0)+1; save(); renderPractice(); };
  } else $("#nextQ").onclick=()=>{ const n=nextPracticeQ(items,p.q.id); practice={p:prepQ(n), ans:null, done:false, idk:false, before:null}; state.lastQ=n.id; save(); renderPractice(); window.scrollTo(0,0); };
}

/* ===== Karteikarten mit Wiederholungsplan ===== */
function buildDeck(free){
  const items=allK().filter(inFilter);
  if(free){ const pool=items.slice(), deck=[]; while(deck.length<Math.min(10,pool.length)){ const x=weightedPick(pool); deck.push(x); pool.splice(pool.indexOf(x),1); } return deck; }
  const due=dueCards(items), fresh=items.filter(x=>!isSeen(x.id));
  return due.concat(fresh).slice(0,Math.max(10,Math.min(due.length,30)));
}
function cardCtx(c){ const t=sessions()[c.s]; return `Sitzung ${c.s}${t?": "+t:""}${c.ctx?" · "+c.ctx:""}`; }
function renderCards(){
  if(!cards || !cards.deck){ cards={deck:buildDeck(false), i:0, flip:false, right:0, free:false, req:{}}; }
  const D=cards.deck, items=allK().filter(inFilter);
  const head=`<div class="row"><h1 class="grow">Karten</h1>${filterSelect()}</div>`;
  const bindHead=()=>bindFilter(()=>{ cards=null; renderCards(); });
  if(cards.i>=D.length){
    const left=dueCards(items).length+items.filter(x=>!isSeen(x.id)).length;
    const nextDue=items.filter(x=>isSeen(x.id)&&!isDue(x.id)).map(x=>state.due[x.id]).sort((a,b)=>a-b)[0];
    $("#app").innerHTML=head+`<div class="block"><h2>${D.length?(left?"Runde geschafft":"Für heute erledigt"):"Heute ist nichts fällig"}</h2>
      ${D.length?`<p>${cards.right} von ${D.length} Antworten gewusst.</p>`:""}
      <p class="small muted">${left?`Noch ${left} Karten fällig oder neu.`:`Alle Karten sind auf dem Stand.${nextDue?` Die nächsten werden ${whenText(nextDue)} fällig.`:""}`} Gewusste Karten kommen nach 1, 3, 7, 16 und 35 Tagen wieder, nicht gewusste sofort noch einmal.</p>
      <div class="row">${left?`<button class="btn" id="again">Weiter</button>`:""}<button class="btn ghost" id="free">Freiwillig weiterüben</button></div></div>`;
    bindHead();
    if($("#again")) $("#again").onclick=()=>{ cards=null; renderCards(); };
    $("#free").onclick=()=>{ cards={deck:buildDeck(true), i:0, flip:false, right:0, free:true, req:{}}; renderCards(); };
    return;
  }
  const c=D[cards.i], b=boxOf(c.id);
  $("#app").innerHTML=head+`
    <div class="row between"><p class="eyebrow">Karte ${cards.i+1} von ${D.length}${cards.free?" · freiwillig":isSeen(c.id)?" · fällig":" · neu"}</p><span class="dots" aria-label="Fach ${b} von 5">${[1,2,3,4,5].map(i=>`<i class="${i<=b?"on":""}"></i>`).join("")}</span></div>
    <div class="block card" id="card" style="margin-top:8px" role="button" tabindex="0" aria-label="Karte umdrehen">
      <p class="cctx">${inl(cardCtx(c))}</p><div class="front">${inl(c.f)}</div>
      ${cards.flip?`<div class="back">${richText(c.b)}</div>${infoHTML(c.i)}`:`<p class="tap">Tippen zum Umdrehen</p>`}</div>
    ${cards.flip?`<div class="row"><button class="btn" id="yes" style="flex:1">Gewusst</button><button class="btn warn" id="no" style="flex:1">Nicht gewusst</button></div>`
      :`<p class="small muted">Erst selbst erklären, dann umdrehen.</p>`}`;
  bindHead();
  const cd=$("#card"); cd.onclick=e=>{ if(e.target.closest("a,button,select")) return; cards.flip=!cards.flip; renderCards(); };
  cd.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); cd.click(); } };
  const answer=ok=>{ gradeCard(c,ok,cards.free); track(state.course, ok);
    if(ok) cards.right++; else if((cards.req[c.id]||0)<2){ cards.req[c.id]=(cards.req[c.id]||0)+1; D.push(c); }
    save(); cards.i++; cards.flip=false; renderCards(); };
  if($("#yes")) $("#yes").onclick=()=>answer(true);
  if($("#no")) $("#no").onclick=()=>answer(false);
}

/* ===== Quiz-Simulation ===== */
function blockOf(n){ return QUIZZES.find(z=>z.n===n); }
function defaultBlock(){ const t=new Date(); t.setHours(0,0,0,0); const nx=QUIZZES.find(z=>new Date(z.open+"T00:00:00")>=t); return nx?nx.n:4; }
function quizPool(b){ const qs=allQ(); return b==="alle" ? qs : qs.filter(x=>blockOf(b).s.includes(Number(x.s))); }
function blockLabel(b){ if(b==="alle") return "Alle Sitzungen"; const z=blockOf(b); return `Quiz ${b} (Sitzung ${z.s[0]}–${z.s[z.s.length-1]})`; }
function renderQuiz(){
  if(!quiz){
    if(state.quizBlock===undefined) state.quizBlock=defaultBlock();
    const b=state.quizBlock, pool=quizPool(b);
    const have = b==="alle" ? null : blockOf(b).s.filter(n=>sessions()[n]);
    $("#app").innerHTML = `
      <h1>Quiz-Simulation</h1>
      <label class="small muted">Stoff <select id="qb">${QUIZZES.map(z=>`<option value="${z.n}"${b===z.n?" selected":""}>${blockLabel(z.n)}</option>`).join("")}<option value="alle"${b==="alle"?" selected":""}>Alle Sitzungen</option></select></label>
      <div class="block" style="margin-top:12px">
        <p>Wie auf Moodle: 12 Fragen, 15 Minuten, bestanden ab 7 richtigen Antworten. Du kannst zwischen den Fragen springen und erst am Ende abgeben.</p>
        ${have && have.length<blockOf(b).s.length ? `<p class="small" style="color:var(--bad)">Bisher ${have.length?`nur Sitzung ${have.join(", ")}`:"keine Sitzung"} von ${blockOf(b).s.length} in der App. Die Simulation deckt den Stoff also noch nicht ganz ab.</p>` : ""}
        <p class="small muted">${pool.length} Fragen im Pool${pool.length<12?". Für eine volle Simulation braucht es mindestens 12.":"."}</p>
        <button class="btn" id="start"${pool.length?"":" disabled"}>Simulation starten</button>
      </div>`;
    $("#qb").onchange=e=>{ state.quizBlock=e.target.value==="alle"?"alle":Number(e.target.value); save(); renderQuiz(); };
    $("#start").onclick=startQuiz;
    return;
  }
  if(quiz.running) return renderQuizRunning();
  renderQuizResult();
}
function startQuiz(){
  const b=state.quizBlock, pool = shuffle(quizPool(b)).slice(0,12).map(prepQ);
  const sc=b==="alle"?"alle":"q"+b, prev=state.quizzes.filter(z=>z.scope===sc).slice(-1)[0]||null;
  quiz = {items:pool, answers:Array(pool.length).fill(null), cur:0, end:Date.now()+15*60*1000, running:true, scope:sc, prev};
  clearInterval(timerId); timerId=setInterval(tick,1000); renderQuiz();
}
function tick(){
  if(!quiz||!quiz.running) return clearInterval(timerId);
  const left = quiz.end-Date.now();
  if(left<=0){ finishQuiz(); toast("Zeit abgelaufen. Das Quiz wurde abgegeben."); return; }
  const el=$("#timer"); if(el){ el.textContent=fmt(left); el.classList.toggle("low",left<120000); }
}
const fmt = ms => { const s=Math.max(0,Math.ceil(ms/1000)); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); };
const qDone = i => isAnswered(quiz.items[i], quiz.answers[i]);
function renderQuizRunning(){
  const it = quiz.items[quiz.cur], a = quiz.answers[quiz.cur];
  const done = quiz.items.filter((_,i)=>qDone(i)).length;
  $("#app").innerHTML = `
    <div class="row"><div class="grow"><div class="timer" id="timer">${fmt(quiz.end-Date.now())}</div><span class="small muted" id="qCount">${done} von ${quiz.items.length} beantwortet</span></div>
      <button class="btn" id="submit">Abgeben</button></div>
    <div class="coins">${quiz.items.map((_,i)=>`<button class="coin${qDone(i)?" done":""}${i===quiz.cur?" now":""}" data-i="${i}" aria-label="Frage ${i+1}">${i+1}</button>`).join("")}</div>
    <div class="block">
      <p class="small muted">Frage ${quiz.cur+1}${typeHint(it)?" · "+typeHint(it):""}</p>
      <div class="q">${inl(it.q.q)}</div>
      ${answerHTML(it, a, false)}
    </div>
    <div class="row"><button class="btn ghost grow" id="prev"${quiz.cur===0?" disabled":""}>Zurück</button><button class="btn ghost grow" id="next"${quiz.cur===quiz.items.length-1?" disabled":""}>Weiter</button></div>`;
  document.querySelectorAll(".coin").forEach(b=>b.onclick=()=>{quiz.cur=+b.dataset.i;renderQuiz();});
  bindAnswer(it, ()=>quiz.answers[quiz.cur], (val,instant,redraw)=>{
    quiz.answers[quiz.cur]=val; track("od");
    if(instant && it.t==="sc" && quiz.cur<quiz.items.length-1){ quiz.cur++; return renderQuiz(); }
    if(redraw) return renderQuiz();
    const c=document.querySelector(`.coin[data-i="${quiz.cur}"]`); if(c) c.classList.toggle("done", qDone(quiz.cur));
    const n=$("#qCount"); if(n) n.textContent=`${quiz.items.filter((_,i)=>qDone(i)).length} von ${quiz.items.length} beantwortet`;
  });
  $("#prev").onclick=()=>{quiz.cur--;renderQuiz();};
  $("#next").onclick=()=>{quiz.cur++;renderQuiz();};
  const sub=$("#submit");
  sub.onclick=()=>{
    const open = quiz.items.length-quiz.items.filter((_,i)=>qDone(i)).length;
    if(open && !sub.dataset.armed){ sub.dataset.armed="1"; sub.textContent=`${open} offen. Trotzdem abgeben`; return; }
    finishQuiz();
  };
}
function finishQuiz(){
  clearInterval(timerId);
  quiz.running=false;
  quiz.ok = quiz.items.map((it,i)=>isRight(it, quiz.answers[i]));
  quiz.score = quiz.ok.filter(Boolean).length;
  quiz.items.forEach((it,i)=>{ grade(it.q.id, quiz.ok[i]); countAnswer(quiz.ok[i]); });
  state.quizzes.push({date:Date.now(), score:quiz.score, total:quiz.items.length, scope:quiz.scope});
  save(); view="quiz"; render(); window.scrollTo(0,0);
}
function renderQuizResult(){
  const pass = quiz.score>=7;
  $("#app").innerHTML = `
    <h1>Ergebnis</h1>
    <div class="block">
      <div class="verdict ${pass?"pass":"fail"}">${quiz.score} von ${quiz.items.length}: ${pass?"bestanden":"nicht bestanden"}</div>${quiz.prev?`<p class="small muted" style="margin:4px 0 0">Zuletzt in diesem Stoff: ${quiz.prev.score} von ${quiz.prev.total}</p>`:""}
      <div class="coins">${quiz.items.map((it,i)=>`<span class="coin ${quiz.ok[i]?"ok":"no"}">${i+1}</span>`).join("")}</div>
      <p class="small muted">${pass?"Mit "+quiz.score+" Punkten liegst du "+(quiz.score>=8?"über":"unter")+" dem Schnitt von 7,5, den du für 30 Punkte insgesamt brauchst.":"Für das echte Quiz brauchst du mindestens 7. Übe die falschen Fragen, sie kommen jetzt öfter dran."}</p>
      <div class="row"><button class="btn" id="again">Neue Simulation</button><button class="btn ghost" id="toPr">Fehler üben</button></div>
    </div>
    <h2>Durchsicht</h2>
    ${quiz.items.map((it,i)=>{ const a=quiz.answers[i], ok=quiz.ok[i]; return `<div class="review">
      <p class="small" style="color:var(--${ok?"good":"bad"})">Frage ${i+1}: ${ok?"richtig":isAnswered(it,a)?"falsch":"nicht beantwortet"}</p>
      <p><strong>${inl(it.q.q)}</strong></p>
      ${isAnswered(it,a) && !ok && it.t!=="sc" ? `<p class="small">Deine Antwort: ${inl(answerText(it,a))}</p>` : ""}
      ${isAnswered(it,a) ? fbHTML(it,a,false) : fbHTML(it,a,true).replace("Kein Problem, die Frage kommt gleich noch einmal.","Nicht beantwortet.")}</div>`; }).join("")}`;
  $("#again").onclick=()=>{quiz=null;renderQuiz();};
  $("#toPr").onclick=()=>{quiz=null;state.errOnly=true;practice=null;save();go("practice");};
}

/* ===== Zoom (pro Gerät) ===== */
(function(){
  let z = parseFloat(lsGet("od-zoom")) || 1;
  const apply = () => { document.documentElement.style.setProperty("--z", z); lsSet("od-zoom", String(z)); };
  apply();
  document.getElementById("zIn").onclick = () => { z = Math.min(1.8, Math.round((z+0.1)*10)/10); apply(); };
  document.getElementById("zOut").onclick = () => { z = Math.max(0.8, Math.round((z-0.1)*10)/10); apply(); };
})();

/* ===== Start ===== */
load().then(render);
</script>
</body>
