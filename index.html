<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lern-App Wirtschaft & Gesellschaft I</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="W&amp;G I">
<meta name="theme-color" content="#2F6F62">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" href="icon-192.png?v=2">
<link rel="manifest" href="manifest.webmanifest?v=2">
<style>
:root{
  --bg:#ECEFE8; --surface:#F8F9F5; --ink:#1C2B3A; --muted:#5B6873; --line:#C9D0C6;
  --accent:#2F6F62; --accent-ink:#FFFFFF; --good:#2F7A4A; --bad:#A3392B; --gold:#B5862A;
  --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ color-scheme:dark;
    --bg:#131A1F; --surface:#1C252C; --ink:#E3E8E2; --muted:#9AA6AE; --line:#33414B;
    --accent:#6FB3A2; --accent-ink:#0F1A17; --good:#6CC28B; --bad:#E07A6B; --gold:#D9AE55; }
}
*{box-sizing:border-box}
html{font-size:calc(100% * var(--z,1))}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.5 var(--sans);-webkit-font-smoothing:antialiased}
main{max-width:40rem;margin:0 auto;padding:20px 18px 110px}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.2;margin:0 0 .4em}
h1{font-size:1.75rem} h2{font-size:1.35rem} h3{font-size:1.08rem}
p{margin:0 0 .8em}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.block{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
button,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:12px 18px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.warn{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav .wrap{display:flex;max-width:640px;width:100%}
nav button{flex:1;background:none;border:0;padding:12px 4px 14px;font-size:.82rem;color:var(--muted);border-top:3px solid transparent}
nav button[aria-current="page"]{color:var(--ink);border-top-color:var(--accent);font-weight:600}

/* Münzleiste: 12 Fragen der Quiz-Simulation */
.coins{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;margin:12px 0}
.coin{aspect-ratio:1;border-radius:50%;border:2px solid var(--line);background:transparent;padding:0;font-size:.7rem;color:var(--muted);display:grid;place-items:center}
.coin.done{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.coin.now{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.coin.ok{background:var(--good);border-color:var(--good);color:#fff}
.coin.no{background:transparent;border-color:var(--bad);color:var(--bad)}

.timer{font-family:var(--serif);font-size:2.6rem;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.timer.low{color:var(--bad)}
.q{font-family:var(--serif);font-size:1.2rem;line-height:1.4;margin:6px 0 14px}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;line-height:1.4}
.opt.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.expl{border-left:3px solid var(--accent);padding:4px 0 4px 12px;margin:14px 0}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.card{min-height:220px;display:flex;flex-direction:column;justify-content:center;text-align:center;cursor:pointer;user-select:none}
.card .front{font-family:var(--serif);font-size:1.45rem}
.card .back{white-space:pre-line;text-align:left;line-height:1.55}
textarea{width:100%;min-height:180px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;font-family:ui-monospace,Menlo,monospace;font-size:.82rem}
.verdict{font-family:var(--serif);font-size:1.6rem}
.verdict.pass{color:var(--good)} .verdict.fail{color:var(--bad)}
.review{border-top:1px solid var(--line);padding:12px 0}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
table{width:100%;border-collapse:collapse;font-size:.9rem}
td{padding:6px 0;border-bottom:1px solid var(--line)}
td:last-child{text-align:right}
.switch{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:0 0 18px}
.switch button{background:transparent;border:0;padding:10px 6px;font-weight:600;color:var(--muted)}
.switch button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.zoom{position:fixed;right:12px;bottom:calc(64px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;z-index:5}
.zoom button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:22px;line-height:1;opacity:.85;box-shadow:0 1px 4px rgba(0,0,0,.15)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app"><p class="muted">Lade …</p></main>
<nav><div class="wrap" id="nav"></div></nav>
<div class="zoom" aria-label="Schriftgröße"><button id="zIn" aria-label="Größer">+</button><button id="zOut" aria-label="Kleiner">−</button></div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ===== Fragen und Karten: Sitzung 1 ===== */
/* Bei Fragen steht die richtige Antwort immer an erster Stelle in "o"; die App mischt sie. */
const BASE = {
  sitzungen: { "1": "Grundlagen und Antike" },
  fragen: [
    {id:"s1-01",s:1,q:"Wie wird ein Modell in der Vorlesung definiert?",o:["Eine vereinfachte Darstellung der Realität, mit der bestimmte Zusammenhänge isoliert untersucht werden","Eine möglichst vollständige Abbildung der Realität","Eine empirisch bewiesene Gesetzmäßigkeit","Eine normative Vorgabe, wie Wirtschaft funktionieren soll"],e:"Ein Modell kann und soll nicht die gesamte Realität abbilden, sondern bestimmte Mechanismen."},
    {id:"s1-02",s:1,q:"Was veranschaulicht das Beispiel des U-Bahn-Plans?",o:["Ein Modell zeigt nur, was für seine Frage wichtig ist (Stationen, keine Straßen)","Modelle müssen maßstabsgetreu sein","Modelle sind immer geografisch","Je detaillierter ein Modell, desto besser"],e:"U-Bahn-Pläne zeigen nur die Stationen, keine Straßen."},
    {id:"s1-03",s:1,q:"Welches Modell gehört NICHT zu den fünf Modellen des Kernlehrplans?",o:["Gefangenendilemma","Homo oeconomicus","Erweiterter Wirtschaftskreislauf","Modell des Konjunkturzyklus"],e:"Die fünf: Homo oeconomicus, Marktmodell, erweiterter Wirtschaftskreislauf, soziales Interaktionsmodell, Konjunkturzyklus."},
    {id:"s1-04",s:1,q:"Welches der folgenden Modelle gehört zu den fünf Modellen des Kernlehrplans?",o:["Soziales Interaktionsmodell","Akerlofs Lemons-Modell","Modell der Spieltheorie","Modell der Geldschöpfung"],e:"Die fünf: Homo oeconomicus, Marktmodell, erweiterter Wirtschaftskreislauf, soziales Interaktionsmodell, Konjunkturzyklus."},
    {id:"s1-05",s:1,q:"Welche Frage gehört NICHT zu den Fragen, die man laut Vorlesung immer an ein Modell stellen muss?",o:["Wer hat das Modell zuerst veröffentlicht?","Was nimmt es an?","Was blendet es aus?","Was können wir damit nicht erklären?"],e:"Die fünf Fragen: Welche Frage beantwortet es? Was nimmt es an? Was blendet es aus? Was können wir damit erklären? Was nicht?"},
    {id:"s1-06",s:1,q:"Wie wurde das Fach Wirtschaftswissenschaften historisch bezeichnet?",o:["Politische Ökonomie","Kameralistik der Moderne","Chrematistik","Haushaltslehre"],e:"Der Begriff Politische Ökonomie macht die interdisziplinäre Perspektive deutlich: Wirtschaft im Zusammenhang mit Politik und Gesellschaft."},
    {id:"s1-07",s:1,q:"Welche Inhaltsfelder des Kernlehrplans sind besonders ökonomisch ausgerichtet?",o:["Inhaltsfeld 1 (Marktwirtschaftliche Ordnung) und Inhaltsfeld 4 (Wirtschaftspolitik)","Inhaltsfeld 2 und Inhaltsfeld 3","Nur Inhaltsfeld 1","Inhaltsfeld 1 und Inhaltsfeld 5"],e:"IF 1: Marktwirtschaftliche Ordnung, IF 4: Wirtschaftspolitik."},
    {id:"s1-08",s:1,q:"Was untersuchen Wirtschaftswissenschaften laut Vorlesung?",o:["Wie Menschen und Gesellschaften Güter und Ressourcen produzieren, verteilen und verwenden","Ausschließlich das Verhalten von Unternehmen auf Märkten","Nur die Geldpolitik von Zentralbanken","Wie man den Gewinn eines Betriebs maximiert"],e:"Dazu kommt die Frage, wie Wirtschaft, politische Institutionen, Macht und gesellschaftliche Interessen zusammenhängen."},
    {id:"s1-09",s:1,q:"In welchen Zusammenhang waren wirtschaftliche Fragen in der Antike NICHT eingebettet?",o:["Finanzmärkte und Börsenhandel","Ethik/Philosophie","Haushaltsführung","Landwirtschaft"],e:"Eingebettet in Ethik/Philosophie, Politik, Haushaltsführung und Landwirtschaft."},
    {id:"s1-10",s:1,q:"Was war in der Antike die zentrale Produktionseinheit?",o:["Haushalt bzw. Gutshof","Manufaktur","Fabrik","Handelsgesellschaft"],e:"Hintergrund: Agrargesellschaft, Gutshof, Sklaverei, begrenzte Märkte, zunehmende Monetarisierung."},
    {id:"s1-11",s:1,q:"Wer betrachtet Arbeitsteilung als Organisation des Haushalts bzw. Gutshofs?",o:["Xenophon","Platon","Aristoteles","Cicero"],e:"Xenophons Fragestellung wirkt „betriebswirtschaftlich“: Wie lässt sich Arbeit sinnvoll organisieren?"},
    {id:"s1-12",s:1,q:"Wer betrachtet Arbeitsteilung als gesellschaftliches Prinzip?",o:["Platon","Xenophon","Cato","Columella"],e:"Menschen können ihre Bedürfnisse nicht allein befriedigen; Arbeitsteilung erzeugt gegenseitige Abhängigkeit."},
    {id:"s1-13",s:1,q:"Was erzeugt Arbeitsteilung nach Platon?",o:["Gegenseitige Abhängigkeit","Vollständige Autarkie jedes Haushalts","Steigenden Eigennutz","Sinkende Spezialisierung"],e:"Die Frage verschiebt sich vom einzelnen Haushalt zur Organisation der Gesellschaft."},
    {id:"s1-14",s:1,q:"Wodurch wird Arbeitsteilung in der Antike (noch) NICHT primär erklärt?",o:["Durch Markt, Preise und individuellen Eigennutz","Durch eine Vorstellung gesellschaftlicher Ordnung","Durch unterschiedliche Fähigkeiten","Durch die Organisation des Gutshofs"],e:"Wirtschaftliches Handeln erscheint als Teil der Gesellschaft, nicht als eigenständige Sphäre."},
    {id:"s1-15",s:1,q:"Was ist Arbeitsteilung?",o:["Aufteilung wirtschaftlicher Tätigkeiten auf unterschiedliche Personen, wodurch Spezialisierung und häufig höhere Produktivität möglich werden","Die gleichmäßige Verteilung des Einkommens","Die Trennung von Haushalt und Staat","Der Tausch von Gütern gegen Geld"],e:"Konzept-Folie zur Arbeitsteilung."},
    {id:"s1-16",s:1,q:"Welche Funktion hat Geld nach Aristoteles?",o:["Es erleichtert den Austausch und macht unterschiedliche Güter vergleichbar","Es dient vor allem der Vermögensanhäufung","Es ist entstanden, weil der Staat Steuern eintreiben wollte","Es ersetzt den Wert der Arbeit"],e:"Wichtig: Das ist eine Aussage über den Nutzen von Geld, nicht über seine historische Entstehung."},
    {id:"s1-17",s:1,q:"Worüber trifft Aristoteles mit seiner Erklärung von Geld eine Aussage?",o:["Über den Nutzen von Geld","Über die historische Entstehung von Geld","Über die Geldmenge","Über Zinsen"],e:"Die Folie betont: keine Aussage über die Entstehung, sondern eine Frage nach dem Nutzen."},
    {id:"s1-18",s:1,q:"Was macht Geld nach Aristoteles NICHT wertvoll?",o:["Die Arbeitszeit, die zu seiner Herstellung nötig ist","Gebrauch","Seltenheit","Vergleichbarkeit"],e:"Wertbestimmend: Gebrauch, Austausch, Seltenheit, Vergleichbarkeit."},
    {id:"s1-19",s:1,q:"Was bezeichnet Aristoteles als Oikonomia?",o:["Wirtschaften zur Bedarfsdeckung","Geldvermehrung zum Selbstzweck","Handel mit fremden Städten","Staatliche Steuerpolitik"],e:"Oikonomia = Bedarfsdeckung; Chrematistik = Geldvermehrung zum Selbstzweck."},
    {id:"s1-20",s:1,q:"Was bezeichnet Aristoteles als Chrematistik?",o:["Geldvermehrung zum Selbstzweck","Wirtschaften zur Bedarfsdeckung","Die Lehre vom gerechten Preis","Die Führung des Gutshofs"],e:"Hintergrund: Ist jede Form des Gelderwerbs legitim?"},
    {id:"s1-21",s:1,q:"Was ist eine normative Aussage?",o:["Eine Aussage darüber, wie etwas sein sollte","Eine Aussage darüber, wie etwas ist","Eine statistisch geprüfte Aussage","Eine Aussage über Normen in der Industrie"],e:"Beispiel der Folie: Was ist notwendig für eine gerechte Gesellschaft?"},
    {id:"s1-22",s:1,q:"Was ist eine positive Aussage?",o:["Eine Aussage darüber, wie etwas ist bzw. funktioniert","Eine Aussage darüber, wie etwas sein sollte","Eine zustimmende Bewertung","Eine optimistische Prognose"],e:"„Positiv“ heißt hier beschreibend, nicht „gut“."},
    {id:"s1-23",s:1,q:"Laut Folie ist „Ist die Gesellschaft gerecht?“ ein Beispiel für …",o:["… eine positive Aussage","… eine normative Aussage","… eine Informationsasymmetrie","… eine Modellannahme"],e:"Die Folie führt „Ist die Gesellschaft gerecht?“ und „Warum ist die Gesellschaft gerecht?“ als positive Beispiele. Normativ ist dagegen: Was ist notwendig für eine gerechte Gesellschaft?"},
    {id:"s1-24",s:1,q:"Welcher Wandel des ökonomischen Denkens vollzieht sich von der Antike zur Moderne?",o:["Von einem normativen zu einem positiven Verständnis","Von einem positiven zu einem normativen Verständnis","Von der Theorie zur Praxis","Vom Markt zum Haushalt"],e:"In der Antike hängt wirtschaftliches Handeln an der Frage, was ein gutes Leben und eine gute Gesellschaft ausmacht."},
    {id:"s1-25",s:1,q:"Ciceros Getreidehändler weiß, dass morgen viel Getreide eintrifft und der Preis fällt. Welcher moderne Begriff beschreibt das Problem?",o:["Informationsasymmetrie","Opportunitätskosten","Arbeitsteilung","Chrematistik"],e:"Die Beteiligten einer Transaktion sind unterschiedlich gut informiert."},
    {id:"s1-26",s:1,q:"Mit welchem Beispiel ist Akerlofs „The Market for Lemons“ verbunden?",o:["Gebrauchtwagenmarkt","Getreidehandel im alten Rom","Arbeitsmarkt für Sklaven","Aktienmarkt"],e:"Akerlof (1970): Quality Uncertainty and the Market Mechanism."},
    {id:"s1-27",s:1,q:"Was zeigt Ciceros Getreidehändler-Beispiel über Handel?",o:["Handel ist mehr als Preise und Mengen; es geht um Regeln, Wissen und Moral","Handel funktioniert nur mit vollständiger Information","Händler sollen den Preis maximieren","Preise sind immer gerecht"],e:"Folie: Handel ist mehr als Preise und Mengen."},
    {id:"s1-28",s:1,q:"Wie hoch ist bei Platon das Maximalvermögen?",o:["Das Vierfache des Existenzminimums","Das Doppelte des Existenzminimums","Das Zehnfache des Existenzminimums","Es gibt keine Obergrenze"],e:"Der Staat legt ein Existenzminimum fest; alles über dem Vierfachen geht an den Staat bzw. die Schutzgötter."},
    {id:"s1-29",s:1,q:"Was geschieht bei Platon mit Vermögen oberhalb des Maximalvermögens?",o:["Es geht an den Staat bzw. die Schutzgötter","Es wird an die Armen verteilt","Es wird verboten zu erwerben","Es wird in Land investiert"],e:"Platons Gerechtigkeitsmodell."},
    {id:"s1-30",s:1,q:"Womit beschäftigt sich Cato in seiner Schrift zur Betriebsführung?",o:["Kosten, Arbeitsorganisation, Auslastung und Eigenproduktion vs. Einkauf","Geld als Tauschmittel","Gerechte Vermögensverteilung","Informationspflichten von Händlern"],e:"Der Gutshof wird kalkulatorisch betrachtet. Moderner Begriff: make or buy."},
    {id:"s1-31",s:1,q:"Welcher moderne Begriff entspricht der Frage „Produktion selbst oder zukaufen?“",o:["Make or buy","Opportunitätskosten","Arbeitsteilung","Rendite"],e:"Tabelle „Antike und Moderne“."},
    {id:"s1-32",s:1,q:"Wer betrachtet Investitionen als Verhältnis von Aufwand und erwartetem Ertrag und vergleicht sie mit Alternativen?",o:["Columella","Cato","Xenophon","Aristoteles"],e:"Daraus folgen die Konzepte Rendite und Opportunitätskosten."},
    {id:"s1-33",s:1,q:"Ertrag 20 €, Kosten 5 €. Wie hoch ist die Rendite nach der Formel der Vorlesung?",o:["300 %","400 %","75 %","15 %"],e:"(20 − 5) / 5 = 3 = 300 %."},
    {id:"s1-34",s:1,q:"Ertrag 30 €, Kosten 10 €. Wie hoch ist die Rendite?",o:["200 %","300 %","20 %","66 %"],e:"(30 − 10) / 10 = 2 = 200 %."},
    {id:"s1-35",s:1,q:"Du kaufst einen Fernseher für 1.000 € statt das Geld zu 4 % p. a. anzulegen. Wie hoch sind die Opportunitätskosten (ein Jahr)?",o:["40 €","1.000 €","1.040 €","4 €"],e:"Entgangener Ertrag der besten Alternative: 4 % von 1.000 € = 40 €."},
    {id:"s1-36",s:1,q:"Was sind Opportunitätskosten?",o:["Der entgangene Nutzen oder Ertrag der nicht gewählten Alternative","Die direkten Ausgaben für ein Gut","Die Kosten für Informationsbeschaffung","Die Steuern auf einen Gewinn"],e:"Kosten für entgangenen Nutzen bei anderer Verwendung eines Gutes oder Produktionsfaktors."},
    {id:"s1-37",s:1,q:"Welcher moderne Begriff entspricht dem antiken Problem „Menschen reagieren auf Belohnungen“?",o:["Anreize","Geld und Wert","Informationsasymmetrie","Arbeitsteilung"],e:"Tabelle „Antike und Moderne“."},
    {id:"s1-38",s:1,q:"Welcher moderne Begriff entspricht dem antiken Problem „Tausch benötigt Vergleichbarkeit“?",o:["Geld und Wert","Make or buy","Anreize","Steuer- und Transfersysteme"],e:"Tabelle „Antike und Moderne“."},
    {id:"s1-39",s:1,q:"Welcher moderne Begriff entspricht der antiken Frage „Was ist eine gerechte Gesellschaft?“",o:["Steuer- und Transfersysteme","Rendite","Arbeitsteilung","Informationsasymmetrie"],e:"Tabelle „Antike und Moderne“."},
    {id:"s1-40",s:1,q:"Welche Aussage über die Antike trifft laut Vorlesung zu?",o:["Antike Autoren stellen ähnliche Fragen, entwickeln aber noch keine geschlossenen ökonomischen Modelle","Die Antike kannte bereits ein ausgearbeitetes Marktmodell","Wirtschaftswissenschaft war in der Antike eine eigenständige Disziplin","Antike Autoren erklärten Arbeitsteilung über Preise und Eigennutz"],e:"Ähnliche Fragestellung ≠ gleiche Theorie."},
    {id:"s1-41",s:1,q:"Was ist eine der Take-aways der ersten Sitzung?",o:["Ökonomische Modelle sind historisch entstandene Perspektiven auf Probleme, nicht die Probleme selbst","Ökonomische Probleme sind erst in der Moderne entstanden","Moderne Modelle bilden die Realität vollständig ab","Die Antike ist für heutige Wirtschaftsfragen irrelevant"],e:"Weitere Take-aways: Viele ökonomische Probleme sind sehr alt; keine eigenständige Disziplin in der Antike."},
    {id:"s1-42",s:1,q:"Richtig oder falsch: Ökonomische Modelle entstehen unabhängig von historischen Ereignissen.",o:["Falsch","Richtig"],fix:true,a:0,e:"Grundidee der Vorlesung: Modelle entstehen nicht losgelöst von historischen und gesellschaftlichen Bedingungen."},
    {id:"s1-43",s:1,typ:"multi",q:"Was macht Geld nach Aristoteles wertvoll? (Mehrere Antworten sind richtig.)",o:["Gebrauch","Austausch","Seltenheit","Vergleichbarkeit","Die zu seiner Herstellung nötige Arbeitszeit","Eine staatliche Goldgarantie"],a:[0,1,2,3],e:"Gebrauch, Austausch, Seltenheit, Vergleichbarkeit."},
    {id:"s1-44",s:1,typ:"multi",q:"In welche Zusammenhänge waren wirtschaftliche Fragen in der Antike eingebettet? (Mehrere Antworten sind richtig.)",o:["Ethik/Philosophie","Politik","Haushaltsführung","Landwirtschaft","Finanzmärkte","Industrielle Produktion"],a:[0,1,2,3],e:"Ethik/Philosophie, Politik, Haushaltsführung, Landwirtschaft."},
    {id:"s1-45",s:1,typ:"zuord",q:"Ordne den antiken Autoren ihr Thema zu.",paare:[["Xenophon","Arbeitsteilung als Organisation des Gutshofs"],["Platon","Arbeitsteilung als gesellschaftliches Prinzip"],["Aristoteles","Oikonomia und Chrematistik"],["Cicero","Getreidehändler und Informationsasymmetrie"],["Cato","Kosten, Auslastung, make or buy"],["Columella","Investition im Vergleich zu Alternativen"]],e:"Siehe Folien zu Produktion, Geld/Tausch und Entscheidungen."},
    {id:"s1-46",s:1,typ:"zuord",q:"Ordne dem antiken Problem den modernen Begriff zu.",paare:[["Spezialisierung von Tätigkeiten","Arbeitsteilung"],["Menschen reagieren auf Belohnungen","Anreize"],["Tausch benötigt Vergleichbarkeit","Geld und Wert"],["Verkäufer wissen mehr als Käufer","Informationsasymmetrie"],["Lohnt sich eine Investition?","Rendite/Opportunitätskosten"],["Was ist eine gerechte Gesellschaft?","Steuer- und Transfersysteme"]],e:"Tabelle „Antike und Moderne“."},
    {id:"s1-47",s:1,typ:"zahl",q:"Ertrag 50 €, Kosten 10 €. Wie hoch ist die Rendite in Prozent?",a:400,einheit:"%",e:"(50 − 10) / 10 = 4 = 400 %."},
    {id:"s1-48",s:1,typ:"zahl",q:"Statt 2.500 € zu 2 % p. a. anzulegen, kaufst du ein E-Bike. Wie hoch sind die Opportunitätskosten für ein Jahr in Euro?",a:50,einheit:"€",e:"2 % von 2.500 € = 50 €."}
  ],
  karten: [
    {id:"s1-k01",s:1,f:"Modell",b:"Vereinfachte Darstellung der Realität, mit der bestimmte Zusammenhänge isoliert untersucht werden.\nBeispiel: U-Bahn-Plan zeigt nur Stationen, keine Straßen."},
    {id:"s1-k02",s:1,f:"Fünf Fragen an jedes Modell",b:"Welche Frage beantwortet es?\nWas nimmt es an?\nWas blendet es aus?\nWas können wir damit erklären?\nWas können wir damit nicht erklären?"},
    {id:"s1-k03",s:1,f:"Fünf Modelle des Kernlehrplans",b:"Homo oeconomicus\nMarktmodell\nErweiterter Wirtschaftskreislauf\nSoziales Interaktionsmodell\nModell des Konjunkturzyklus"},
    {id:"s1-k04",s:1,f:"Politische Ökonomie",b:"Historische Bezeichnung des Fachs. Wirtschaft wird im Zusammenhang mit Politik und Gesellschaft gedacht (interdisziplinär)."},
    {id:"s1-k05",s:1,f:"Antike: Einbettung der Wirtschaft",b:"Ethik/Philosophie, Politik, Haushaltsführung, Landwirtschaft.\nHintergrund: Agrargesellschaft, Gutshof als Produktionseinheit, Sklaverei, begrenzte Märkte, zunehmende Monetarisierung."},
    {id:"s1-k06",s:1,f:"Xenophon (~400 v. Chr.)",b:"Arbeitsteilung als Organisation von Haushalt/Gutshof, nach Fähigkeiten und Aufgaben. Führung und Anreize. „Betriebswirtschaftliche“ Perspektive."},
    {id:"s1-k07",s:1,f:"Platon: Arbeitsteilung",b:"Gesellschaftliches Prinzip: Niemand kann alle Bedürfnisse allein befriedigen. Spezialisierung verteilt Aufgaben und erzeugt gegenseitige Abhängigkeit."},
    {id:"s1-k08",s:1,f:"Platon: gerechte Gesellschaft",b:"Staat legt Existenzminimum fest. Maximalvermögen = 4 × Existenzminimum. Alles darüber geht an den Staat bzw. die Schutzgötter."},
    {id:"s1-k09",s:1,f:"Arbeitsteilung",b:"Aufteilung wirtschaftlicher Tätigkeiten auf unterschiedliche Personen → Spezialisierung, häufig höhere Produktivität.\nIn der Antike noch nicht über Markt, Preise und Eigennutz erklärt."},
    {id:"s1-k10",s:1,f:"Aristoteles: Geld",b:"Erleichtert den Austausch und macht Güter vergleichbar. Aussage über den Nutzen, nicht über die Entstehung.\nWert durch: Gebrauch, Austausch, Seltenheit, Vergleichbarkeit."},
    {id:"s1-k11",s:1,f:"Oikonomia vs. Chrematistik",b:"Oikonomia: Bedarfsdeckung.\nChrematistik: Geldvermehrung zum Selbstzweck.\n(Aristoteles: Ist jeder Gelderwerb legitim?)"},
    {id:"s1-k12",s:1,f:"Normativ vs. positiv",b:"Normativ: wie etwas sein sollte („Was ist notwendig für eine gerechte Gesellschaft?“).\nPositiv: wie etwas ist bzw. funktioniert („Ist die Gesellschaft gerecht?“).\nAntike → Moderne: von normativ zu positiv."},
    {id:"s1-k13",s:1,f:"Cicero (~100 v. Chr.)",b:"Getreidehändler: Muss er sagen, dass der Preis morgen fällt?\nHandel ist mehr als Preise und Mengen: Regeln, Wissen, Moral → Informationsasymmetrie."},
    {id:"s1-k14",s:1,f:"Informationsasymmetrie",b:"Beteiligte einer Transaktion sind unterschiedlich gut informiert.\nAkerlof (1970): The Market for Lemons → Gebrauchtwagenmarkt."},
    {id:"s1-k15",s:1,f:"Cato (~50 v. Chr.)",b:"Kalkulatorische Betriebsführung: Kosten, Arbeitsorganisation, Auslastung, Eigenproduktion vs. Einkauf (make or buy)."},
    {id:"s1-k16",s:1,f:"Columella (~50 n. Chr.)",b:"Investition als Verhältnis von Aufwand und erwartetem Ertrag, Vergleich mit alternativen Verwendungen → Rendite, Opportunitätskosten."},
    {id:"s1-k17",s:1,f:"Rendite",b:"(Ertrag − Kosten) / Kosten\nBeispiel: (20 − 5) / 5 = 300 %"},
    {id:"s1-k18",s:1,f:"Opportunitätskosten",b:"Entgangener Nutzen/Ertrag der nicht gewählten Alternative.\nBeispiel: Fernseher für 1.000 € statt Anlage zu 4 % → 40 €."},
    {id:"s1-k19",s:1,f:"Antikes Problem → moderner Begriff",b:"Spezialisierung → Arbeitsteilung\nBelohnungen → Anreize\nVergleichbarkeit im Tausch → Geld und Wert\nVerkäufer weiß mehr → Informationsasymmetrie\nSelbst produzieren oder zukaufen → make or buy\nLohnt sich Investition → Rendite/Opportunitätskosten\nGerechte Gesellschaft → Steuer- und Transfersysteme"},
    {id:"s1-k20",s:1,f:"Take-aways Sitzung 1",b:"Viele ökonomische Probleme sind sehr alt.\nModelle sind historisch entstandene Perspektiven auf Probleme, nicht die Probleme selbst.\nIn der Antike keine eigenständige Wirtschaftswissenschaft.\nÄhnliche Fragestellung ≠ gleiche Theorie."}
  ]
};

/* ===== Sozialstruktur: Karteikarten Sitzung 1 ===== */
const BASE_SOZ = {
  sitzungen: { "1": "Einführung (15.10.)" },
  karten: [
    {id:"soz1-k01",s:1,f:"Struktur (Glatzer 2002)",b:"Eine Mehrzahl von Einheiten ist nicht zufällig angeordnet bzw. verbunden. Es gibt Regelmäßigkeiten oder Muster: Was an einer Stelle auftritt, kehrt an einer anderen wieder."},
    {id:"soz1-k02",s:1,f:"Soziologie als Verhaltenswissenschaft",b:"Ziel: soziale Phänomene erklären und vorhersagen.\nNicht: Verhalten einzelner Menschen (Warum läuft Herr K. Amok?).\nSondern: strukturierende Einflüsse, die Handeln systematisch beeinflussen (Welche gesellschaftlichen Bedingungen fördern die Häufigkeit von Amokläufen?)."},
    {id:"soz1-k03",s:1,f:"Ziel jeder Sozialstrukturanalyse",b:"Faktoren bestimmen, die Verhalten systematisch beeinflussen.\nFokus: Muster, verursacht durch offene oder verdeckte soziale Regeln.\nKein Interesse am Einzelfall, sondern an Durchschnittswerten bzw. Wahrscheinlichkeiten.\nSoziale Regeln manifestieren sich in sozialen Strukturen."},
    {id:"soz1-k04",s:1,f:"Goldene Regel",b:"Keine Argumentation mit Einzelfällen!\nBeispiel: „Raucher sterben nicht früher“ (Helmut Schmidt, ca. 40 Zigaretten am Tag, wurde 96).\nGegenbeleg: Überlebensraten britischer Ärzte, Raucher vs. Nichtraucher (Doll et al. 2004)."},
    {id:"soz1-k05",s:1,f:"Wie entsteht Sozialstruktur?",b:"Von Menschen gemacht: Grundlage und Ergebnis menschlichen Handelns.\nEntsteht durch bewusst oder unbewusst geschaffene, dauerhafte und durchsetzbare Regeln.\nRegeln steuern, ordnen und stabilisieren soziale Prozesse.\nBegrenzte Reichweite, historisch und kulturell wandelbar.\nBestand und Wandel hängen von der Verteilung von Ressourcen (Macht) ab."},
    {id:"soz1-k06",s:1,f:"Restriktionen",b:"Beschränkungen des individuellen Handlungsspielraums.\nKönnen enger oder weiter sein.\nNatürlich (Schwerkraft, Klima) oder sozial (Normen, Gesetze)."},
    {id:"soz1-k07",s:1,f:"Ressourcen",b:"Mehr (weniger) Ressourcen = mehr (weniger) Macht.\nRessourcen wirken in Kombination mit Restriktionen auf den Handlungsspielraum."},
    {id:"soz1-k08",s:1,f:"Lebensverlaufsansatz: drei Wechselwirkungen",b:"1. Zwischen Lebensbereichen (Beruf im Kontext von Familie).\n2. Vorher-nachher: frühere Erfahrungen strukturieren aktuelles Verhalten (frühere Arbeitslosigkeit → Angst vor Jobverlust).\n3. Mit dem Verhalten anderer, „linked lives“ (Partnerschaft braucht Zustimmung beider)."},
    {id:"soz1-k09",s:1,f:"Drei generelle Faktoren der Sozialstrukturanalyse",b:"Restriktionen – Ressourcen – Lebensverlauf"},
    {id:"soz1-k10",s:1,f:"Sozialordnung",b:"Gesellschaften müssen Verhaltensregeln („Spielregeln“) und Kriterien der Ressourcenverteilung festlegen.\nDie Sozialordnung soll sorgen für:\nEffizienz (keine Ressourcen verschwenden)\nGerechtigkeit (Ressourcen gerecht verteilen)"},
    {id:"soz1-k11",s:1,f:"Soziale Ungleichheit",b:"Eng verbunden mit Sozialstruktur und Sozialordnung.\nNicht per se gut oder schlecht.\nImmer verbunden mit Fragen der Motivation und Gerechtigkeit.\nRelevant für die praktische Sozialpolitik."},
    {id:"soz1-k12",s:1,f:"Seit wann gibt es Sozialstruktur?",b:"In frühen Gruppen: unterschiedliche Funktionen und Ressourcenverteilung, aber eher interne Gruppenstruktur.\nVon Sozialstruktur spricht man erst mit größeren, komplexeren Gesellschaften seit der Antike."},
    {id:"soz1-k13",s:1,f:"Stände (Schäfers/Kopp 2006)",b:"Soziale Gruppierungen mit spezifischen Rechten (Privilegien) und Pflichten, deren ungleicher Status rechtlich abgesichert ist.\nEntscheidend für Standeszugehörigkeit und Lebenschancen: soziale Herkunft.\nUm 1795: Adel, Geistlichkeit, Bürgertum (z. B. Handwerker), einfaches Volk (Bauern, Arbeiter)."},
    {id:"soz1-k14",s:1,f:"Merkmale moderner Gesellschaften",b:"Rationale Lebensführung / Selbstkontrolle\nErfahrungswissenschaftlicher und technischer Fortschritt\nSoziale Mobilität\nSäkularisierung\nAusdifferenzierung von Subsystemen\nPluralisierung\nIndividualisierung\nspäter: Industrialisierung"},
    {id:"soz1-k15",s:1,f:"Voraussetzungen der Industrialisierung in Deutschland",b:"Bauernbefreiung (Ende feudaler Abhängigkeit)\nBerufs- und Niederlassungsfreiheit, mehr Mobilität\nBevölkerungswachstum\nSteigender Bildungsstand\nTrennung von Arbeits- und Wohnort, Wandel der Familie\n(Späte) Nationalstaatsgründung bzw. Zollunion\n(Späte) Demokratisierung, Sozialversicherungen"},
    {id:"soz1-k16",s:1,f:"Modernisierung",b:"(Vormoderne) Agrargesellschaft → (moderne) Industriegesellschaft → (postmoderne?) Dienstleistungsgesellschaft (?)\nSpätestens seit dem 19. Jh. grundlegender Wandel der Sozialstruktur.\nOffene Frage: Wie beschreibt man die (post-)moderne Gesellschaft am besten?"},
    {id:"soz1-k17",s:1,f:"Karl Marx (1818–1883): Klassengesellschaft",b:"Hintergrund: Industrialisierung, wenige Fabrikanten vs. viele arme Arbeiter.\nEine Ungleichheitsdimension: Besitz von Produktionsmitteln (Kapital).\nZwei Klassen: Bourgeoisie vs. Proletariat.\nArbeiter müssen ihre Arbeitskraft verkaufen, werden ausgebeutet, sind fremdbestimmt.\nKlassen stehen sich antagonistisch gegenüber (Klassenkonflikt)."},
    {id:"soz1-k18",s:1,f:"Max Weber (1864–1920)",b:"Drei Ungleichheitsdimensionen:\nKlasse: Besitz von Kapital und Wissen\nStand: soziales Prestige (Ansehen)\nPartei: Potenzial, Gruppeninteressen zu organisieren (Konfliktfähigkeit)"},
    {id:"soz1-k19",s:1,f:"Schichtmodelle",b:"Bolte-Zwiebel: Schichtung Westdeutschlands, 1960er (Bolte/Kappe/Neidhardt 1967)\nHaus-Modell von Dahrendorf: Westdeutschland, 1960er (1965)\nHaus-Modell für Deutschland 2000 (Geißler 2008)"},
    {id:"soz1-k20",s:1,f:"Grenzen von Klassen- und Schichtmodellen",b:"Nur vertikale Ungleichheit (Beruf, Qualifikation, ökonomische Lage).\nHorizontale Ungleichheit fehlt (Geschlecht, Alter, Generation, Region).\nMentalitäten und Lebensstile innerhalb von Klassen/Schichten kaum berücksichtigt.\nDaher seit den 1970er/80er Jahren: Lebenslage – Lebensstil – Milieu."},
    {id:"soz1-k21",s:1,f:"Traditionelle vs. Neue Sozialstrukturanalyse",b:"Traditionell: identifiziert Großgruppen (Klassen, Schichten, Lebenslagen). Prämisse: Handeln ist Produkt gesellschaftlicher Strukturen.\nNeu: identifiziert Indikatoren (Alter, Bildung, Geschlecht), die individuelles Handeln strukturieren. Prämisse: Gesellschaftliches Handeln ist Produkt strukturierten individuellen Handelns."},
    {id:"soz1-k22",s:1,f:"Homo sociologicus vs. Homo oeconomicus",b:"Homo sociologicus: „Rädchen im Getriebe“, Spielball sozialer Gegebenheiten, Position durch Rollenerwartungen bestimmt. Sozialstruktur reproduziert sich selbst bzw. wird von Eliten bestimmt.\nHomo oeconomicus: „seines Glückes Schmied“, vollkommen rationaler Akteur, Position durch Talent und Präferenzen. Sozialstruktur ergibt sich aus freien Handlungen.\nBeide: Pole eines idealtypischen Kontinuums."},
    {id:"soz1-k23",s:1,f:"Einordnung auf dem Kontinuum",b:"Gruppenzentriert → akteurszentriert:\nTraditionelle Sozialstrukturanalyse (Klasse, Schicht, Lebenslage, Lebensstil, Milieu) → Neue Sozialstrukturanalyse → neoklassische bzw. neoliberale Ökonomie"},
    {id:"soz1-k24",s:1,f:"Was ist klausurrelevant?",b:"Vor allem die Ausführungen in der Vorlesung und die Folien.\nDringend empfohlen: parallel das Lehrbuch Erlinghagen & Hank (2018), Neue Sozialstrukturanalyse."}
  ],
  /* Schreibaufgaben: {id:"soz2-a01", s:2, q:"Aufgabe", k:["Kriterium = 1 Punkt", ...], m:"Musterlösung"} */
  aufgaben: [
    {"id": "soz1-a01", "s": 1, "q": "Erläutern Sie, was in der Soziologie unter „Sozialstruktur“ verstanden wird und warum die Sozialstrukturanalyse nicht mit Einzelfällen argumentiert.", "k": ["Struktur als nicht zufällige Anordnung bzw. Verbindung von Einheiten; Regelmäßigkeiten und Muster (Glatzer)", "Soziologie interessiert sich nicht für das Verhalten Einzelner, sondern für strukturierende Einflüsse (z. B. Amok-Beispiel)", "Ziel: Faktoren bestimmen, die Verhalten systematisch beeinflussen", "Interesse an Durchschnittswerten bzw. Wahrscheinlichkeiten statt am Einzelfall", "Soziale Regeln manifestieren sich in sozialen Strukturen", "Beispiel: Helmut Schmidt als unzulässiger Einzelfall vs. Überlebensraten von Rauchern (Doll et al. 2004)"], "m": "Sozialstruktur bezeichnet Regelmäßigkeiten und Muster: Einheiten sind nicht zufällig angeordnet, sodass Wiederkehrendes erwartbar ist (Glatzer 2002). Die Soziologie fragt nicht, warum ein Einzelner handelt, sondern welche gesellschaftlichen Bedingungen Handeln systematisch beeinflussen. Die Sozialstrukturanalyse sucht deshalb nach Faktoren, die Verhalten im Durchschnitt bzw. mit bestimmter Wahrscheinlichkeit prägen. Die sichtbare Struktur ist Ausdruck wirksamer sozialer Regeln. Ein Einzelfall widerlegt solche Zusammenhänge nicht: Dass Helmut Schmidt trotz starken Rauchens alt wurde, sagt nichts gegen die höhere Sterblichkeit von Rauchern, die etwa die Ärztestudie von Doll et al. zeigt."},
    {"id": "soz1-a02", "s": 1, "q": "Erklären Sie die drei generellen Faktoren der Sozialstrukturanalyse und wie sie zusammenwirken.", "k": ["Restriktionen als Begrenzung des Handlungsspielraums; enger oder weiter", "Restriktionen natürlicher Art (Schwerkraft, Klima) und sozialer Art (Normen, Gesetze)", "Ressourcen: mehr Ressourcen bedeuten mehr Macht", "Restriktionen und Ressourcen wirken in Kombination auf den Handlungsspielraum", "Lebensverlauf: Wechselwirkungen zwischen Lebensbereichen (z. B. Beruf und Familie)", "Lebensverlauf: Vorher-nachher-Wechselwirkungen und „linked lives“"], "m": "Die drei Faktoren sind Restriktionen, Ressourcen und Lebensverlauf. Restriktionen begrenzen den Handlungsspielraum und können natürlich (Klima, Schwerkraft) oder sozial (Normen, Gesetze) sein, enger oder weiter. Ressourcen bedeuten Macht: Wer mehr hat, kann Restriktionen eher überwinden. Beide wirken also zusammen. Der Lebensverlaufsansatz ergänzt die zeitliche und soziale Verflechtung: Entscheidungen in einem Lebensbereich hängen mit anderen zusammen (Beruf und Familie), frühere Erfahrungen prägen aktuelles Verhalten (frühere Arbeitslosigkeit und Angst vor Jobverlust), und Entscheidungen hängen vom Handeln anderer ab (linked lives, z. B. Partnerschaft)."},
    {"id": "soz1-a03", "s": 1, "q": "Vergleichen Sie die Klassenkonzepte von Karl Marx und Max Weber.", "k": ["Marx: historischer Kontext Industrialisierung, wenige Fabrikanten vs. viele arme Arbeiter", "Marx: eine Ungleichheitsdimension, Besitz von Produktionsmitteln", "Marx: zwei Klassen, Bourgeoisie und Proletariat", "Marx: Ausbeutung, Fremdbestimmung, antagonistischer Klassenkonflikt", "Weber: drei Ungleichheitsdimensionen", "Weber: Klasse = Besitz von Kapital und Wissen", "Weber: Stand = soziales Prestige; Partei = Organisation von Gruppeninteressen", "Fazit: Marx eindimensional, Weber mehrdimensional und differenzierter"], "m": "Marx entwickelt sein Modell vor dem Hintergrund der Industrialisierung im 19. Jahrhundert. Die soziale Position bestimmt sich bei ihm über eine einzige Dimension, den Besitz von Produktionsmitteln. Daraus folgen zwei Klassen: die Bourgeoisie, die besitzt und herrscht, und das Proletariat, das nur seine Arbeitskraft verkaufen kann und ausgebeutet wird. Die Klassen stehen sich antagonistisch gegenüber. Weber dagegen unterscheidet drei Dimensionen: Klasse (Besitz von Kapital und Wissen), Stand (soziales Prestige) und Partei (Fähigkeit, Gruppeninteressen zu organisieren). Weber erfasst Ungleichheit damit mehrdimensional und differenzierter als Marx, bei dem allein die ökonomische Lage zählt."},
    {"id": "soz1-a04", "s": 1, "q": "Erläutern Sie die Grenzen von Klassen- und Schichtmodellen und welche Ansätze daraus hervorgegangen sind.", "k": ["Klassen- und Schichtmodelle erfassen vor allem vertikale Ungleichheit (Beruf, Qualifikation, ökonomische Lage)", "Horizontale Ungleichheiten fehlen (Geschlecht, Alter, Generation, Region)", "Mentalitäten und Lebensstile innerhalb von Klassen/Schichten werden kaum berücksichtigt", "Beispiele für Schichtmodelle: Bolte-Zwiebel, Haus-Modell von Dahrendorf bzw. Geißler", "Neuere Ansätze seit den 1970er/80er Jahren: Lebenslage, Lebensstil, Milieu"], "m": "Schichtmodelle wie die Bolte-Zwiebel oder das Haus-Modell von Dahrendorf ordnen die Bevölkerung vertikal nach Beruf, Qualifikation und ökonomischer Lage. Damit bleiben horizontale Ungleichheiten wie Geschlecht, Alter, Generation oder Region unberücksichtigt. Außerdem unterscheiden sich Menschen innerhalb einer Schicht in Mentalitäten und Lebensstilen, was die Modelle kaum abbilden. Seit den 1970er/80er Jahren wurden deshalb Konzepte der Lebenslage, des Lebensstils und des Milieus entwickelt."},
    {"id": "soz1-a05", "s": 1, "q": "Stellen Sie die traditionelle und die Neue Sozialstrukturanalyse gegenüber und ordnen Sie beide auf dem Kontinuum zwischen Homo sociologicus und Homo oeconomicus ein.", "k": ["Traditionell: Identifikation gesellschaftlich relevanter Großgruppen (Klassen, Schichten, Lebenslagen)", "Traditionell: Prämisse, Handeln ist Produkt gesellschaftlicher Strukturen", "Neu: Identifikation von Indikatoren (Alter, Bildung, Geschlecht), die individuelles Handeln strukturieren", "Neu: Prämisse, gesellschaftliches Handeln ist Produkt strukturierten individuellen Handelns", "Homo sociologicus: „Rädchen im Getriebe“, Position durch Rollenerwartungen bestimmt", "Homo oeconomicus: „seines Glückes Schmied“, rationaler Akteur, Position durch Talent und Präferenzen", "Einordnung: traditionelle SSA gruppenzentriert nahe Homo sociologicus, Neue SSA dazwischen, neoklassische Ökonomie am akteurszentrierten Pol", "Hinweis, dass es sich um ein idealtypisches Kontinuum handelt"], "m": "Die traditionelle Sozialstrukturanalyse sucht nach gesellschaftlich relevanten Großgruppen wie Klassen, Schichten oder Milieus und geht davon aus, dass Handeln ein Produkt gesellschaftlicher Strukturen ist. Die Neue Sozialstrukturanalyse sucht dagegen nach Indikatoren wie Alter, Bildung oder Geschlecht, die individuelles Handeln strukturieren. Gesellschaftliches Handeln ist hier Produkt strukturierten individuellen Handelns. Auf dem idealtypischen Kontinuum steht am einen Pol der Homo sociologicus, das „Rädchen im Getriebe“, dessen Position durch Rollenerwartungen festgelegt ist. Am anderen Pol steht der Homo oeconomicus, der rationale Akteur und „seines Glückes Schmied“. Die traditionelle Analyse liegt nahe am gruppenzentrierten Pol, die Neue Sozialstrukturanalyse in der Mitte, die neoklassische Ökonomie am akteurszentrierten Pol."},
    {"id": "soz1-a06", "s": 1, "q": "Erläutern Sie, was eine Sozialordnung leisten muss und in welchem Verhältnis sie zu sozialer Ungleichheit steht.", "k": ["Gesellschaften müssen Verhaltensregeln („Spielregeln“) festlegen", "Gesellschaften müssen Kriterien der Ressourcenverteilung festlegen", "Ziel Effizienz: keine Ressourcen verschwenden", "Ziel Gerechtigkeit: Ressourcen gerecht verteilen", "Soziale Ungleichheit ist nicht per se gut oder schlecht; verbunden mit Motivation und Gerechtigkeit; relevant für Sozialpolitik"], "m": "Jede Gesellschaft muss Spielregeln für das Verhalten und Kriterien für die Verteilung von Ressourcen festlegen. Diese Sozialordnung soll zwei Ziele erfüllen: Effizienz, also keine Verschwendung von Ressourcen, und Gerechtigkeit, also eine gerechte Verteilung. Sozialstruktur, Sozialordnung und soziale Ungleichheit hängen eng zusammen. Ungleichheit ist dabei nicht automatisch gut oder schlecht: Sie berührt Fragen der Motivation (Anreize) und der Gerechtigkeit. Als Ausdruck sozialer Ungleichheit ist die Sozialstruktur deshalb für die praktische Sozialpolitik relevant."},
    {"id": "soz1-a07", "s": 1, "q": "Beschreiben Sie den Wandel von der vormodernen Ständegesellschaft zur modernen Gesellschaft in Deutschland.", "k": ["Stände: Gruppen mit rechtlich abgesichertem ungleichem Status, Rechten und Pflichten", "In der Ständegesellschaft entscheidet die soziale Herkunft über die Lebenschancen", "Merkmale der Moderne, z. B. soziale Mobilität, Säkularisierung, Individualisierung, Pluralisierung, Ausdifferenzierung", "Voraussetzungen der Industrialisierung, z. B. Bauernbefreiung, Berufs- und Niederlassungsfreiheit, Bevölkerungswachstum, Bildung", "Trennung von Arbeits- und Wohnort, späte Nationalstaatsgründung, Sozialversicherungen", "Abfolge Agrargesellschaft → Industriegesellschaft → (Dienstleistungsgesellschaft?)"], "m": "In der vormodernen Ständegesellschaft gehörten Menschen Ständen wie Adel, Geistlichkeit, Bürgertum oder einfachem Volk an. Diese hatten rechtlich abgesicherte, ungleiche Rechte und Pflichten, und die soziale Herkunft bestimmte die Lebenschancen. Moderne Gesellschaften sind dagegen durch soziale Mobilität, rationale Lebensführung, wissenschaftlichen Fortschritt, Säkularisierung, Ausdifferenzierung, Pluralisierung und Individualisierung geprägt. In Deutschland war die Industrialisierung an Voraussetzungen gebunden, etwa an die Bauernbefreiung, die Berufs- und Niederlassungsfreiheit, das Bevölkerungswachstum, den steigenden Bildungsstand und die Trennung von Arbeits- und Wohnort. Später kamen Nationalstaat bzw. Zollunion, Demokratisierung und Sozialversicherungen hinzu. Spätestens seit dem 19. Jahrhundert wandelt sich die Agrar- zur Industriegesellschaft. Ob heute von einer Dienstleistungsgesellschaft zu sprechen ist, bleibt offen."}
  ]
};

const GH = {api:"https://api.github.com/repos/talib47/lernapp/contents/fortschritt.json", branch:"fortschritt", tokenKey:"od-gh-token"};
let store="none", ghToken=null, remoteSha=null, syncStatus="aus", lastSync=null, pushTimer=null, pushing=false, pushAgain=false;

function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

function initToken(){
  const m = location.hash.match(/[#&]t=([A-Za-z0-9_]+)/);
  if(m){ lsSet(GH.tokenKey, m[1]); try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){} }
  ghToken = lsGet(GH.tokenKey);
}
const ghHeaders = () => ({"Authorization":"Bearer "+ghToken,"Accept":"application/vnd.github+json"});
const b64enc = str => btoa(unescape(encodeURIComponent(str)));
const b64dec = str => decodeURIComponent(escape(atob(str.replace(/\n/g,""))));

async function pull(){
  if(!ghToken) return null;
  const r = await fetch(GH.api+"?ref="+GH.branch+"&_="+Date.now(), {headers:ghHeaders(), cache:"no-store"});
  if(r.status===404){ remoteSha=null; return {}; }
  if(r.status===401){ syncStatus="schluessel"; return null; }
  if(!r.ok) throw new Error(r.status);
  const d = await r.json(); remoteSha = d.sha;
  return JSON.parse(b64dec(d.content));
}
async function push(){
  if(!ghToken) return;
  if(pushing){ pushAgain=true; return; }
  pushing=true;
  try{
    for(let attempt=0; attempt<2; attempt++){
      const body={message:"Lernstand", branch:GH.branch, content:b64enc(JSON.stringify(state))};
      if(remoteSha) body.sha=remoteSha;
      const r = await fetch(GH.api, {method:"PUT", headers:ghHeaders(), body:JSON.stringify(body)});
      if(r.ok){ const d=await r.json(); remoteSha=d.content.sha; syncStatus="ok"; lastSync=new Date(); break; }
      if(r.status===401){ syncStatus="schluessel"; break; }
      if(r.status===409||r.status===422){ await pull(); continue; }  // veraltete Version: neu holen und nochmal
      syncStatus="fehler"; break;
    }
  }catch(e){ syncStatus="fehler"; }
  pushing=false;
  if(pushAgain){ pushAgain=false; push(); }
}
function schedulePush(){ if(!ghToken) return; clearTimeout(pushTimer); pushTimer=setTimeout(push, 1500); }
function flushPush(){ if(pushTimer){ clearTimeout(pushTimer); pushTimer=null; push(); } }

/* Neuerer Stand gewinnt: Vergleich über den Zeitstempel "updated" */
async function syncFromRemote(){
  if(!ghToken) return false;
  try{
    const remote = await pull();
    if(remote===null) return false;
    if(remote.updated && remote.updated > (state.updated||0)){
      state = Object.assign(state, remote); lsSet(KEY, JSON.stringify(state));
      syncStatus="ok"; lastSync=new Date(); return true;
    }
    if((state.updated||0) > (remote.updated||0)) await push();
    else { syncStatus="ok"; lastSync=new Date(); }
  }catch(e){ syncStatus="fehler"; }
  return false;
}

  await syncFromRemote();

function weightedPick(items, avoidId){
  const pool = items.length>1 ? items.filter(x=>x.id!==avoidId) : items;
  const w = pool.map(x=>[6,5,4,3,2,1][boxOf(x.id)]);
  let r = Math.random()*w.reduce((a,b)=>a+b,0);
  for(let i=0;i<pool.length;i++){ r-=w[i]; if(r<=0) return pool[i]; }
  return pool[pool.length-1];
}
/* Fragetypen: sc = eine richtige (Standard), multi = mehrere richtige, zuord = Zuordnung, zahl = Zahleneingabe */
const qType = q => q.typ || "sc";
function prepQ(q){
  const t=qType(q);
  if(t==="zuord") return {q,t,order:shuffle(q.paare.map((_,i)=>i)),rights:shuffle(q.paare.map(x=>x[1]))};
  if(t==="zahl") return {q,t};
  const idx=q.o.map((_,i)=>i);
  return {q,t,order:q.fix?idx:shuffle(idx),correct:t==="multi"?q.a:(Number.isInteger(q.a)?q.a:0)};
}
const numOf = v => { let t=String(v).trim().replace(/\s|€|%/g,""); if(t.includes(",")) t=t.replace(/\./g,"").replace(",","."); else if(/^\d{1,3}(\.\d{3})+$/.test(t)) t=t.replace(/\./g,""); return parseFloat(t); };
function isAnswered(p,a){
  if(a===null||a===undefined) return false;
  if(p.t==="multi") return a.length>0;
  if(p.t==="zuord") return a.some(Boolean);
  if(p.t==="zahl") return String(a).trim()!=="";
  return true;
}
function isRight(p,a){
  if(!isAnswered(p,a)) return false;
  if(p.t==="multi"){ const x=a.slice().sort().join(), y=p.correct.slice().sort().join(); return x===y; }
  if(p.t==="zuord") return p.q.paare.every((pr,i)=>a[i]===pr[1]);
  if(p.t==="zahl") return Math.abs(numOf(a)-p.q.a)<=(p.q.tol||0)+1e-9;
  return a===p.correct;
}
function correctText(p){
  if(p.t==="multi") return p.correct.map(i=>p.q.o[i]).join("; ");
  if(p.t==="zuord") return p.q.paare.map(x=>x[0]+" → "+x[1]).join("; ");
  if(p.t==="zahl") return p.q.a+(p.q.einheit?" "+p.q.einheit:"");
  return p.q.o[p.correct];
}
function answerText(p,a){
  if(!isAnswered(p,a)) return "keine";
  if(p.t==="multi") return a.map(i=>p.q.o[i]).join("; ");
  if(p.t==="zuord") return p.q.paare.map((x,i)=>x[0]+" → "+(a[i]||"?")).join("; ");
  if(p.t==="zahl") return a+(p.q.einheit?" "+p.q.einheit:"");
  return p.q.o[a];
}

function answerHTML(p,a,reveal){

        ${reveal&&!ok?`<span class="small" style="display:block;margin-top:4px">Richtig: ${esc(pr[1])}</span>`:""}</label>`; }).join("")}</div>`;

      <span>${esc(p.q.einheit||"")}</span></div>${reveal&&!ok?`<p class="small" style="margin-top:6px">Richtig: ${esc(correctText(p))}</p>`:""}`;

}

/* ===== Lern-Tracker =====
   Lernzeit zählt nur zwischen zwei Aktionen (Antwort, Karte, Tippen), die höchstens 2 Minuten auseinanderliegen.
   Längere Pausen zählen nicht. Nach 15 Minuten ohne Aktion beginnt eine neue Lernsitzung. */
const IDLE=120000, NEWSESSION=15*60000;
const dayKey = d => { d=new Date(d); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };

function hours(){ if(!state.hours || state.hours.length!==24) state.hours=Array.from({length:24},()=>({t:0,n:0,r:0})); return state.hours; }
function countAnswer(ok){ const now=Date.now(), d=logDay(now), h=hours()[new Date(now).getHours()]; d.n++; h.n++; if(ok){ d.r++; h.r++; } }
function track(course, ok){
  const now=Date.now(), gap=now-(state.lastAct||0);
  if(gap<IDLE){ const sec=Math.round(gap/1000); logDay(now)[course==="soz"?"soz":"od"]+=sec; hours()[new Date(now).getHours()].t+=sec; }
  if(gap>=NEWSESSION) logDay(now).s++;
  state.lastAct=now;
  if(ok!==undefined) countAnswer(ok);
}
function visit(){ const now=Date.now(); if(now-(state.lastVisit||0)>NEWSESSION){ logDay(now).v++; state.lastVisit=now; save(); } }

const fmtMin = sec => { const m=Math.round(sec/60); return m<60 ? m+" Min." : Math.floor(m/60)+" Std. "+(m%60?(m%60)+" Min.":""); };
function bars(vals, labels, title){

      <div style="width:100%;background:var(--accent);border-radius:3px 3px 0 0;height:${v?Math.max(3,v/max*100):0}%"></div></div>`).join("")}</div>
    <div style="display:flex;gap:3px;margin-top:4px">${labels.map(l=>`<span class="small muted" style="flex:1;text-align:center;font-size:.68rem">${l}</span>`).join("")}</div></div>`;
}

  const today=new Date(); today.setHours(12,0,0,0);
  const last=n=>Array.from({length:n},(_,i)=>{ const d=new Date(today); d.setDate(d.getDate()-(n-1-i)); return d; });
  const wk=last(7).map(d=>dayKey(d)), wkSec=wk.reduce((a,k)=>a+(log[k]?tot(k):0),0), wkSess=wk.reduce((a,k)=>a+(log[k]?log[k].s:0),0), wkVis=wk.reduce((a,k)=>a+(log[k]?log[k].v:0),0);
  let streak=0; for(let i=0;;i++){ const d=new Date(today); d.setDate(d.getDate()-i); const k=dayKey(d); if(log[k] && tot(k)>0) streak++; else if(i>0) break; else continue; if(i>400) break; }
  const d14=last(14), v14=d14.map(d=>{const k=dayKey(d); return log[k]?tot(k):0;}), l14=d14.map(d=>["So","Mo","Di","Mi","Do","Fr","Sa"][d.getDay()]);
  const wd=[0,0,0,0,0,0,0]; days.forEach(k=>{ const [y,m,dd]=k.split("-").map(Number); wd[(new Date(y,m-1,dd).getDay()+6)%7]+=tot(k); });
  const blocks=[["morgens",5,11],["mittags",11,15],["nachmittags",15,19],["abends",19,23],["nachts",23,29]].map(([n,a,b])=>{
    let t=0,q=0,r=0; for(let h=a;h<b;h++){ const x=H[h%24]; t+=x.t; q+=x.n; r+=x.r; } return {n,t,q,r}; });
  const most=blocks.slice().sort((a,b)=>b.t-a.t)[0];
  const acc=blocks.filter(b=>b.q>=15).map(b=>({...b,p:Math.round(b.r/b.q*100)})).sort((a,b)=>b.p-a.p);
  // Was bevorsteht

  const next=QUIZZES.find(z=>new Date(z.open+"T00:00:00")>=t0), dn=next?Math.max(1,Math.round((new Date(next.open+"T00:00:00")-t0)/864e5)):null;
  const odItems=mergeById(BASE.fragen,state.custom.fragen).concat(mergeById(BASE.karten,state.custom.karten));

  if(acc.length>=2 && acc[0].p-acc[acc.length-1].p>=10) tips.push(`${acc[0].n[0].toUpperCase()+acc[0].n.slice(1)} triffst du am sichersten (${acc[0].p} % richtig), ${acc[acc.length-1].n} am wenigsten (${acc[acc.length-1].p} %).`);

/* ===== Fortschrittsbalken: hell = schon richtig, dunkel = sicher ===== */
function progRow(k, title, items){
  const n=items.length||1, right=items.filter(x=>boxOf(x.id)>=2).length, sure=items.filter(x=>boxOf(x.id)>=4).length;
  return `<div style="margin:12px 0"><div class="row"><span class="grow">${k}. ${esc(title)}</span></div>
    <div class="bar" style="position:relative"><i style="position:absolute;width:${right/n*100}%;opacity:.35"></i><i style="position:absolute;width:${sure/n*100}%"></i></div>
    <p class="small muted" style="margin:4px 0 0">${right} von ${items.length} schon richtig, ${sure} sicher</p></div>`;
}

/* ===== Bereitschaft pro Quiz ===== */
function readiness(z){
  const have=z.s.filter(n=>sessions()[n]);
  const items=allQ().concat(allK()).filter(x=>z.s.includes(Number(x.s)));
  const sure=items.length?Math.round(items.filter(x=>boxOf(x.id)>=4).length/items.length*100):0;
  const sims=state.quizzes.filter(q=>q.scope==="q"+z.n).slice(-3), good=sims.filter(q=>q.score>=9).length;
  const ready = have.length===z.s.length && sure>=70 && sims.length===3 && good===3;
  return {have, sure, good, ready, empty:!have.length};
}
function readinessBlock(){
  return `<div class="block"><h3>Bereit fürs echte Quiz?</h3>
    <p class="small muted">Jedes Quiz kannst du nur einmal schreiben, Abgabe für alle bis 21.02.2027. „Bereit“ heißt: Der Stoff ist komplett in der App, mindestens 70 % sitzen sicher, und die letzten drei Simulationen hatten jeweils mindestens 9 von 12.</p>
    ${QUIZZES.map(z=>{ const r=readiness(z);
      if(r.empty) return `<div class="review"><strong>Quiz ${z.n}</strong> <span class="small muted">· Sitzung ${z.s[0]}–${z.s[z.s.length-1]} · noch keine Inhalte</span></div>`;

        <p class="small" style="margin:4px 0 0">${r.have.length===z.s.length?"✓":"○"} Inhalte: ${r.have.length} von ${z.s.length} Sitzungen in der App</p>

        <p class="small" style="margin:2px 0 0">${r.good===3?"✓":"○"} Simulationen mit mind. 9 Punkten: ${r.good} von 3</p></div>`; }).join("")}

}

/* ===== Schreiben (Sozialstruktur): Antwort schreiben, Erwartungshorizont abhaken, optional Claude bewerten lassen ===== */
function allA(){ return mergeById(BASE_SOZ.aufgaben||[], (state.soz.aufgaben||[])); }
function wRes(){ if(!state.schreiben) state.schreiben={}; return state.schreiben; }
function wDraft(){ if(!state.entwurf) state.entwurf={}; return state.entwurf; }
function wStat(){
  const a=allA(), r=wRes(), done=a.filter(x=>r[x.id]);
  if(!done.length) return `${a.length} Aufgaben im Klausurstil. Du schreibst eine Antwort und vergleichst sie danach mit dem Erwartungshorizont.`;
  const avg=Math.round(done.reduce((t,x)=>t+r[x.id].p/r[x.id].max,0)/done.length*100);
  return `${done.length} von ${a.length} Aufgaben bearbeitet, im Schnitt ${avg} % der Punkte.`;
}

    bindFilter(renderWrite);
    document.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{ write={id:b.dataset.w, phase:"schreiben", checks:[]}; renderWrite(); window.scrollTo(0,0); });

      <p class="small muted">Deine Antwort:</p><p style="white-space:pre-wrap">${esc(text)}</p></div>
      <div class="block"><h3>Erwartungshorizont</h3><p class="small muted">Hak ab, was in deiner Antwort vorkommt. Jeder Punkt zählt einen Punkt.</p>

    $("#wEdit").onclick=()=>{ write.phase="schreiben"; renderWrite(); };

/* ===== Üben ===== */
function renderPractice(){
  if(!state.err) state.err={};
  const all = allQ().filter(inFilter);
  const errs = all.filter(x=>state.err[x.id] && boxOf(x.id)<4);
  const items = state.errOnly ? errs : all;
  const head = `<div class="row"><h1 class="grow">Üben</h1>${filterSelect()}</div>
    <div class="row" style="margin:-4px 0 10px"><label class="small muted">Modus <select id="mode">
      <option value="0"${state.errOnly?"":" selected"}>Alle Fragen</option>
      <option value="1"${state.errOnly?" selected":""}>Nur meine Fehler (${errs.length})</option></select></label></div>`;
  const bindHead = () => { bindFilter(()=>{practice=null;renderPractice();}); $("#mode").onchange=e=>{ state.errOnly=e.target.value==="1"; practice=null; save(); renderPractice(); }; };
  if(!items.length){
    $("#app").innerHTML = head + (state.errOnly ? `<div class="block"><p>Keine offenen Fehler. Alles, was du falsch hattest, sitzt inzwischen sicher.</p></div>` : `<p>Für diese Auswahl gibt es noch keine Fragen.</p>`);
    bindHead(); return;
  }
  if(!practice || !items.find(x=>x.id===practice.p.q.id)){
    const last = items.find(x=>x.id===state.lastQ);
    practice = {p:prepQ(last || weightedPick(items)), ans:null, done:false};
    state.lastQ = practice.p.q.id;
  }
  const rightAll = all.filter(x=>boxOf(x.id)>=2).length;
  const {p, ans, done} = practice;
  const ok = done && isRight(p,ans);
  $("#app").innerHTML = head + `
    <p class="small muted">${rightAll} von ${all.length} Fragen schon richtig beantwortet. Falsche kommen öfter dran.</p>
    <div class="block">
      <p class="small muted">Sitzung ${esc(p.q.s)}${typeHint(p)?" · "+typeHint(p):""}</p>
      <div class="q">${esc(p.q.q)}</div>
      ${answerHTML(p, ans, done)}
      ${done ? `<div class="expl"><strong>${ok?"Richtig.":"Nicht ganz."}</strong> ${esc(p.q.e||"")}</div>
        <button class="btn" id="nextQ">Nächste Frage</button>`
      : (p.t!=="sc" ? `<button class="btn" id="check" style="margin-top:12px"${isAnswered(p,ans)?"":" disabled"}>Prüfen</button>` : "")}
    </div>`;
  bindHead();
  const check = () => { practice.done=true; const r=isRight(p,practice.ans); grade(p.q.id, r); track("od", r); save(); renderPractice(); };
  if(!done){
    bindAnswer(p, ()=>practice.ans, (a,instant,redraw)=>{
      practice.ans=a;
      if(instant && isAnswered(p,a)) return check();
      if(redraw) renderPractice(); else { const b=$("#check"); if(b) b.disabled=!isAnswered(p,a); }
    });
    const b=$("#check"); if(b) b.onclick=check;
  } else $("#nextQ").onclick=()=>{ practice={p:prepQ(weightedPick(items,p.q.id)), ans:null, done:false}; state.lastQ=practice.p.q.id; save(); renderPractice(); window.scrollTo(0,0); };
}

/* ===== Quiz-Simulation ===== */
function blockOf(n){ return QUIZZES.find(z=>z.n===n); }
function defaultBlock(){ const t=new Date(); t.setHours(0,0,0,0); const nx=QUIZZES.find(z=>new Date(z.open+"T00:00:00")>=t); return nx?nx.n:4; }
function quizPool(b){ const qs=allQ(); return b==="alle" ? qs : qs.filter(x=>blockOf(b).s.includes(Number(x.s))); }
function blockLabel(b){ if(b==="alle") return "Alle Sitzungen"; const z=blockOf(b); return `Quiz ${b} (Sitzung ${z.s[0]}–${z.s[z.s.length-1]})`; }
function renderQuiz(){
  if(!quiz){
    if(state.quizBlock===undefined) state.quizBlock=defaultBlock();
    const b=state.quizBlock, pool=quizPool(b);
    const have = b==="alle" ? null : blockOf(b).s.filter(n=>sessions()[n]);
    $("#app").innerHTML = `
      <h1>Quiz-Simulation</h1>
      <label class="small muted">Stoff <select id="qb">${QUIZZES.map(z=>`<option value="${z.n}"${b===z.n?" selected":""}>${blockLabel(z.n)}</option>`).join("")}<option value="alle"${b==="alle"?" selected":""}>Alle Sitzungen</option></select></label>
      <div class="block" style="margin-top:12px">
        <p>Wie auf Moodle: 12 Fragen, 15 Minuten, bestanden ab 7 richtigen Antworten. Du kannst zwischen den Fragen springen und erst am Ende abgeben.</p>
        ${have && have.length<blockOf(b).s.length ? `<p class="small" style="color:var(--bad)">Bisher ${have.length?`nur Sitzung ${have.join(", ")}`:"keine Sitzung"} von ${blockOf(b).s.length} in der App. Die Simulation deckt den Stoff also noch nicht ganz ab.</p>` : ""}
        <p class="small muted">${pool.length} Fragen im Pool${pool.length<12?". Für eine volle Simulation braucht es mindestens 12.":"."}</p>
        <button class="btn" id="start"${pool.length?"":" disabled"}>Simulation starten</button>
      </div>`;
    $("#qb").onchange=e=>{ state.quizBlock=e.target.value==="alle"?"alle":Number(e.target.value); save(); renderQuiz(); };
    $("#start").onclick=startQuiz;
    return;
  }
  if(quiz.running) return renderQuizRunning();
  renderQuizResult();
}
function startQuiz(){
  const b=state.quizBlock, pool = shuffle(quizPool(b)).slice(0,12).map(prepQ);
  quiz = {items:pool, answers:Array(pool.length).fill(null), cur:0, end:Date.now()+15*60*1000, running:true, scope:b==="alle"?"alle":"q"+b};
  clearInterval(timerId); timerId=setInterval(tick,1000); renderQuiz();
}
function tick(){
  if(!quiz||!quiz.running) return clearInterval(timerId);
  const left = quiz.end-Date.now();
  if(left<=0){ finishQuiz(); toast("Zeit abgelaufen. Das Quiz wurde abgegeben."); return; }
  const el=$("#timer"); if(el){ el.textContent=fmt(left); el.classList.toggle("low",left<120000); }
}
const fmt = ms => { const s=Math.max(0,Math.ceil(ms/1000)); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); };
const qDone = i => isAnswered(quiz.items[i], quiz.answers[i]);
function renderQuizRunning(){
  const it = quiz.items[quiz.cur], a = quiz.answers[quiz.cur];
  const done = quiz.items.filter((_,i)=>qDone(i)).length;
  $("#app").innerHTML = `
    <div class="row"><div class="grow"><div class="timer" id="timer">${fmt(quiz.end-Date.now())}</div><span class="small muted" id="qCount">${done} von ${quiz.items.length} beantwortet</span></div>
      <button class="btn" id="submit">Abgeben</button></div>
    <div class="coins">${quiz.items.map((_,i)=>`<button class="coin${qDone(i)?" done":""}${i===quiz.cur?" now":""}" data-i="${i}" aria-label="Frage ${i+1}">${i+1}</button>`).join("")}</div>
    <div class="block">
      <p class="small muted">Frage ${quiz.cur+1}${typeHint(it)?" · "+typeHint(it):""}</p>
      <div class="q">${esc(it.q.q)}</div>
      ${answerHTML(it, a, false)}
    </div>
    <div class="row"><button class="btn ghost grow" id="prev"${quiz.cur===0?" disabled":""}>Zurück</button><button class="btn ghost grow" id="next"${quiz.cur===quiz.items.length-1?" disabled":""}>Weiter</button></div>`;
  document.querySelectorAll(".coin").forEach(b=>b.onclick=()=>{quiz.cur=+b.dataset.i;renderQuiz();});
  bindAnswer(it, ()=>quiz.answers[quiz.cur], (val,instant,redraw)=>{
    quiz.answers[quiz.cur]=val; track("od");
    if(instant && it.t==="sc" && quiz.cur<quiz.items.length-1){ quiz.cur++; return renderQuiz(); }
    if(redraw) return renderQuiz();
    const c=document.querySelector(`.coin[data-i="${quiz.cur}"]`); if(c) c.classList.toggle("done", qDone(quiz.cur));
    const n=$("#qCount"); if(n) n.textContent=`${quiz.items.filter((_,i)=>qDone(i)).length} von ${quiz.items.length} beantwortet`;
  });
  $("#prev").onclick=()=>{quiz.cur--;renderQuiz();};
  $("#next").onclick=()=>{quiz.cur++;renderQuiz();};
  const sub=$("#submit");
  sub.onclick=()=>{
    const open = quiz.items.length-quiz.items.filter((_,i)=>qDone(i)).length;
    if(open && !sub.dataset.armed){ sub.dataset.armed="1"; sub.textContent=`${open} offen. Trotzdem abgeben`; return; }
    finishQuiz();
  };
}
function finishQuiz(){
  clearInterval(timerId);
  quiz.running=false;
  quiz.ok = quiz.items.map((it,i)=>isRight(it, quiz.answers[i]));
  quiz.score = quiz.ok.filter(Boolean).length;
  quiz.items.forEach((it,i)=>{ grade(it.q.id, quiz.ok[i]); countAnswer(quiz.ok[i]); });
  state.quizzes.push({date:Date.now(), score:quiz.score, total:quiz.items.length, scope:quiz.scope});
  save(); view="quiz"; render(); window.scrollTo(0,0);
}
function renderQuizResult(){
  const pass = quiz.score>=7;
  $("#app").innerHTML = `
    <h1>Ergebnis</h1>
    <div class="block">
      <div class="verdict ${pass?"pass":"fail"}">${quiz.score} von ${quiz.items.length}: ${pass?"bestanden":"nicht bestanden"}</div>
      <div class="coins">${quiz.items.map((it,i)=>`<span class="coin ${quiz.ok[i]?"ok":"no"}">${i+1}</span>`).join("")}</div>
      <p class="small muted">${pass?"Mit "+quiz.score+" Punkten liegst du "+(quiz.score>=8?"über":"unter")+" dem Schnitt von 7,5, den du für 30 Punkte insgesamt brauchst.":"Für das echte Quiz brauchst du mindestens 7. Übe die falschen Fragen, sie kommen jetzt öfter dran."}</p>
      <div class="row"><button class="btn" id="again">Neue Simulation</button><button class="btn ghost" id="toPr">Fehler üben</button></div>
    </div>
    <h2>Durchsicht</h2>
    ${quiz.items.map((it,i)=>{ const a=quiz.answers[i], ok=quiz.ok[i]; return `<div class="review">
      <p class="small" style="color:var(--${ok?"good":"bad"})">Frage ${i+1}: ${ok?"richtig":isAnswered(it,a)?"falsch":"nicht beantwortet"}</p>
      <p><strong>${esc(it.q.q)}</strong></p>
      ${!ok && isAnswered(it,a) ? `<p class="small">Deine Antwort: ${esc(answerText(it,a))}</p>` : ""}
      <p class="small">Richtig: ${esc(correctText(it))}</p>
      ${it.q.e?`<p class="small muted">${esc(it.q.e)}</p>`:""}</div>`; }).join("")}`;
  $("#again").onclick=()=>{quiz=null;renderQuiz();};
  $("#toPr").onclick=()=>{quiz=null;state.errOnly=true;practice=null;save();go("practice");};
}

/* ===== Zoom (pro Gerät) ===== */
(function(){
  let z = parseFloat(lsGet("od-zoom")) || 1;
  const apply = () => { document.documentElement.style.setProperty("--z", z); lsSet("od-zoom", String(z)); };
  apply();
  document.getElementById("zIn").onclick = () => { z = Math.min(1.8, Math.round((z+0.1)*10)/10); apply(); };
  document.getElementById("zOut").onclick = () => { z = Math.max(0.8, Math.round((z-0.1)*10)/10); apply(); };
})();

/* ===== Start ===== */
load().then(render);
</script>
</body>
