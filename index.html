<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lern-App Wirtschaft & Gesellschaft I</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="W&amp;G I">
<meta name="theme-color" content="#2F6F62">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" href="icon-192.png?v=2">
<link rel="manifest" href="manifest.webmanifest?v=2">
<style>
:root{
  --bg:#ECEFE8; --surface:#F8F9F5; --ink:#1C2B3A; --muted:#5B6873; --line:#C9D0C6;
  --accent:#2F6F62; --accent-ink:#FFFFFF; --accent-soft:#DCEAE5; --good:#2F7A4A; --good-soft:#E1EFE5; --bad:#A3392B; --bad-soft:#F5E3E0; --gold:#9A6F1C; --gold-soft:#F3EAD5;
  --mono:ui-monospace,Menlo,Consolas,monospace;
  --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ color-scheme:dark;
    --bg:#131A1F; --surface:#1C252C; --ink:#E3E8E2; --muted:#9AA6AE; --line:#33414B;
    --accent:#6FB3A2; --accent-ink:#0F1A17; --accent-soft:#1F3631; --good:#6CC28B; --good-soft:#1C3325; --bad:#E07A6B; --bad-soft:#3A2220; --gold:#D9AE55; --gold-soft:#3A3020; }
}
*{box-sizing:border-box}
html{font-size:calc(100% * var(--z,1))}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.5 var(--sans);-webkit-font-smoothing:antialiased}
main{max-width:40rem;margin:0 auto;padding:20px 18px 110px}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.2;margin:0 0 .4em}
h1{font-size:1.75rem} h2{font-size:1.35rem} h3{font-size:1.08rem}
p{margin:0 0 .8em}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.block{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
button,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:12px 18px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.warn{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav .wrap{display:flex;max-width:640px;width:100%}
nav button{flex:1;background:none;border:0;padding:12px 4px 14px;font-size:.82rem;color:var(--muted);border-top:3px solid transparent}
nav button[aria-current="page"]{color:var(--ink);border-top-color:var(--accent);font-weight:600}

/* Münzleiste: 12 Fragen der Quiz-Simulation */
.coins{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;margin:12px 0}
@media (max-width:420px){.coins{grid-template-columns:repeat(6,minmax(0,1fr));max-width:18rem}}
.coin{aspect-ratio:1;border-radius:50%;border:2px solid var(--line);background:transparent;padding:0;font-size:.7rem;color:var(--muted);display:grid;place-items:center}
.coin.done{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.coin.now{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.coin.ok{background:var(--good);border-color:var(--good);color:#fff}
.coin.no{background:transparent;border-color:var(--bad);color:var(--bad)}

.timer{font-family:var(--serif);font-size:2.6rem;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.timer.low{color:var(--bad)}
.q{font-family:var(--serif);font-size:1.2rem;line-height:1.4;margin:6px 0 14px}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;line-height:1.4}
.opt.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.expl{border-left:3px solid var(--accent);padding:4px 0 4px 12px;margin:14px 0}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.card{min-height:200px;display:flex;flex-direction:column;gap:10px;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:left}
.card .cctx{margin:0;font-size:.8rem;color:var(--muted);letter-spacing:.01em}
.card .front{font-family:var(--serif);font-size:1.4rem;line-height:1.3;overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto}
.card .back{border-top:1px solid var(--line);padding-top:10px;line-height:1.55}
.card .tap{font-size:.78rem;color:var(--muted);margin:auto 0 0}
textarea{width:100%;min-height:180px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;font-family:ui-monospace,Menlo,monospace;font-size:.82rem}
.verdict{font-family:var(--serif);font-size:1.6rem}
.verdict.pass{color:var(--good)} .verdict.fail{color:var(--bad)}
.review{border-top:1px solid var(--line);padding:12px 0}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
table{width:100%;border-collapse:collapse;font-size:.9rem}
td{padding:6px 0;border-bottom:1px solid var(--line)}
td:last-child{text-align:right}
.switch{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:0 0 18px}
.switch button{background:transparent;border:0;padding:10px 6px;font-weight:600;color:var(--muted)}
.switch button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.zoom{position:fixed;right:12px;bottom:calc(64px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;z-index:5}
.zoom button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:22px;line-height:1;opacity:.85;box-shadow:0 1px 4px rgba(0,0,0,.15)}
/* ---- Textformat (aus Wirtschaft II übernommen) ---- */
.back p,.ml p{margin:0 0 .5em}
.back ul,.back ol,.ml ul,.ml ol{margin:0 0 .5em;padding-left:1.25em}
.back li,.ml li{margin:.2em 0}
.back>:last-child,.ml>:last-child{margin-bottom:0}
.eq{font-family:var(--mono);font-size:.92rem;background:var(--bg);border-radius:8px;padding:8px 10px;margin:6px 0;white-space:normal;overflow-wrap:break-word;line-height:1.55}
.pz{color:var(--muted);font-size:.9em}
.dlist{display:grid;grid-template-columns:fit-content(42%) 1fr;margin:4px 0 8px}
.dlist>b,.dlist>span{padding:6px 0;border-top:1px solid var(--line);min-width:0;overflow-wrap:break-word}
.dlist>b{padding-right:14px;font-weight:600;hyphens:auto;-webkit-hyphens:auto}
.dlist>b:first-child,.dlist>b:first-child+span{border-top:0}
.cmp{width:100%;border-collapse:collapse;font-size:.92rem;margin:6px 0 10px;table-layout:auto}
.cmp th,.cmp td{border-top:1px solid var(--line);border-bottom:0;padding:7px 8px;text-align:left;vertical-align:top;overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto}
.cmp thead th{border-top:0;font-size:.78rem;letter-spacing:.04em;color:var(--muted);font-weight:600}
.cmp tbody th{font-weight:600;padding-left:0}
.cmp td:last-child{text-align:left}
@media (max-width:560px){
  .cmp:not(.tight) thead{display:none}
  .cmp:not(.tight),.cmp:not(.tight) tbody,.cmp:not(.tight) tr,.cmp:not(.tight) th,.cmp:not(.tight) td{display:block;width:100%}
  .cmp:not(.tight) tr{border-top:1px solid var(--line);padding:6px 0}
  .cmp:not(.tight) tr:first-child{border-top:0}
  .cmp:not(.tight) tbody th,.cmp:not(.tight) td{border:0;padding:2px 0}
  .cmp:not(.tight) td{display:grid;grid-template-columns:fit-content(40%) 1fr;gap:10px}
  .cmp:not(.tight) td::before{content:attr(data-l);color:var(--muted);font-size:.8rem;padding-top:1px}
}
.cinfo{display:flex;gap:8px;align-items:flex-start;margin:0;font-size:.82rem;line-height:1.45;color:var(--muted)}
.cinfo .cl{display:block} .cinfo .cl+.cl{margin-top:3px}
.cinfo b{color:var(--ink);font-weight:600}
.cinfo .ci{flex:none;width:18px;height:18px;border-radius:50%;border:1px solid var(--muted);font:600 .7rem/16px var(--serif);font-style:italic;text-align:center;margin-top:1px}
.dots{display:inline-flex;gap:3px} .dots i{width:7px;height:7px;border-radius:50%;border:1px solid var(--muted)} .dots i.on{background:var(--accent);border-color:var(--accent)}
.eyebrow{font-size:.8rem;color:var(--muted);margin:0}
.between{justify-content:space-between}
/* Rückmeldungen */
.fb{margin-top:12px;border-left:3px solid var(--line);padding:2px 0 2px 12px;font-size:.95rem}
.fb.good{border-color:var(--good)} .fb.bad{border-color:var(--bad)} .fb.idk{border-color:var(--gold)}
.fb .fh{margin:0 0 4px;font-weight:600}
.fb.good .fh{color:var(--good)} .fb.bad .fh{color:var(--bad)} .fb.idk .fh{color:var(--gold)}
.fb .dlist{margin:0}
.opt.miss{border-style:dashed;border-color:var(--gold);background:var(--gold-soft)}
.opt .tag{display:block;font-size:.75rem;font-weight:600;margin-top:4px}
.opt.right .tag{color:var(--good)} .opt.wrong .tag{color:var(--bad)} .opt.miss .tag{color:var(--gold)}
.opt.right{background:var(--good-soft)} .opt.wrong{background:var(--bad-soft)}
.idk{border-style:dashed!important;color:var(--muted)!important;background:transparent!important}
/* Chips, Listen, Banner */
.chip{display:inline-block;font-size:.75rem;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.unk{color:var(--gold);border-color:var(--gold)}
.chip.err{color:var(--accent);border-color:var(--accent)}
.tlist{display:flex;flex-direction:column}
.titem{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:12px 2px;border:0;border-top:1px solid var(--line);text-align:left;background:none;width:100%}
.titem:first-child{border-top:0}
.titem .t{font-weight:600;min-width:0;overflow-wrap:break-word}
.titem .d{grid-column:1/-1;font-size:.85rem;color:var(--muted)}
.due{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--accent-soft);border-color:var(--accent)}
.unc{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.btn.small{padding:7px 12px;font-size:.85rem}
.copybox{width:100%;min-height:8rem;margin-top:8px;font-size:.85rem}
.exam ul{margin:.2em 0 .6em;padding-left:1.2em} .exam li{margin:.15em 0}
.srow{padding:12px 0;border-top:1px solid var(--line)} .srow:first-of-type{border-top:0}
/* Statistik: letzte 7 Tage */
.week7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:10px}
.week7 .d{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0;padding:4px 0}
.week7 .bw{height:80px;width:100%;display:flex;align-items:flex-end;justify-content:center}
.week7 .bw i{display:block;width:70%;max-width:2.2rem;background:var(--accent);opacity:.5;border-radius:4px 4px 0 0;min-height:2px}
.week7 .wd{font-size:.78rem;font-weight:600;margin-top:6px}
.week7 .dt{font-size:.68rem;color:var(--muted);font-variant-numeric:tabular-nums}
.week7 .n{font-size:.85rem;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.week7 .u{font-size:.6rem;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis}
.week7 .d.today{background:var(--accent-soft);border-radius:8px}
.week7 .d.today .bw i{opacity:1} .week7 .d.today .wd{color:var(--accent)}
main,.block{min-width:0;overflow-wrap:break-word}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app"><p class="muted">Lade …</p></main>
<nav><div class="wrap" id="nav"></div></nav>
<div class="zoom" aria-label="Schriftgröße"><button id="zIn" aria-label="Größer">+</button><button id="zOut" aria-label="Kleiner">−</button></div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ===== Ökonomisches Denken: Inhalte (Regeln siehe README, „So kommen neue Sitzungen dazu“) ===== */
const BASE = {
  sitzungen: { "1": "Grundlagen und Antike" },
  fragen: [
    {id:"s1-01",s:1,q:"Wie wird ein Modell in der Vorlesung definiert?",o:["Eine vereinfachte Darstellung der Realität, mit der bestimmte Zusammenhänge isoliert untersucht werden","Eine möglichst vollständige Abbildung der Realität","Eine empirisch bewiesene Gesetzmäßigkeit","Eine normative Vorgabe, wie Wirtschaft funktionieren soll"],e:"Ein Modell kann und soll nicht die gesamte Realität abbilden, sondern bestimmte Mechanismen.",
      w:{1:"Laut Folie soll ein Modell gerade **nicht** die ganze Realität abbilden.",2:"Ein Modell ist eine Vereinfachung, kein bewiesenes Gesetz. Es kann Wichtiges ausblenden.",3:"„Wie es sein soll“ wäre normativ. Ein Modell beschreibt vereinfacht, wie etwas funktioniert."}},
    {id:"s1-02",s:1,q:"Was veranschaulicht das Beispiel des U-Bahn-Plans?",o:["Ein Modell zeigt nur, was für seine Frage wichtig ist (Stationen, keine Straßen)","Modelle müssen maßstabsgetreu sein","Modelle sind immer geografisch","Je detaillierter ein Modell, desto besser"],e:"U-Bahn-Pläne zeigen nur die Stationen, keine Straßen.",
      w:{1:"Der U-Bahn-Plan ist gerade **nicht** maßstabsgetreu, und trotzdem nützlich.",2:"Der Plan ist nur ein Bild für Modelle allgemein. Ökonomische Modelle sind nicht geografisch.",3:"Das Gegenteil: Der Stadtplan mit allen Straßen hilft beim U-Bahn-Fahren weniger als der vereinfachte Plan."}},
    {id:"s1-03",s:1,q:"Welches Modell gehört NICHT zu den fünf Modellen des Kernlehrplans?",o:["Gefangenendilemma","Homo oeconomicus","Erweiterter Wirtschaftskreislauf","Modell des Konjunkturzyklus"],e:"Die fünf: Homo oeconomicus, Marktmodell, erweiterter Wirtschaftskreislauf, soziales Interaktionsmodell, Konjunkturzyklus.",
      w:{1:"Der Homo oeconomicus steht als erstes Modell auf der Folie, gehört also dazu.",2:"Der erweiterte Wirtschaftskreislauf ist eines der fünf Modelle.",3:"Das Modell des Konjunkturzyklus ist eines der fünf Modelle."}},
    {id:"s1-04",s:1,q:"Welches der folgenden Modelle gehört zu den fünf Modellen des Kernlehrplans?",o:["Soziales Interaktionsmodell","Akerlofs Lemons-Modell","Modell der Spieltheorie","Modell der Geldschöpfung"],e:"Die fünf: Homo oeconomicus, Marktmodell, erweiterter Wirtschaftskreislauf, soziales Interaktionsmodell, Konjunkturzyklus.",
      w:{1:"Akerlof kommt in der Sitzung vor, aber als Beispiel für Informationsasymmetrie, nicht als Lehrplanmodell.",2:"Spieltheorie steht nicht auf der Folie mit den fünf Modellen.",3:"Geldschöpfung steht nicht auf der Folie mit den fünf Modellen."}},
    {id:"s1-05",s:1,q:"Welche Frage gehört NICHT zu den Fragen, die man laut Vorlesung immer an ein Modell stellen muss?",o:["Wer hat das Modell zuerst veröffentlicht?","Was nimmt es an?","Was blendet es aus?","Was können wir damit nicht erklären?"],e:"Die fünf Fragen: Welche Frage beantwortet es? Was nimmt es an? Was blendet es aus? Was können wir damit erklären? Was nicht?",
      w:{1:"Nach den Annahmen zu fragen, ist eine der fünf Fragen.",2:"Was ein Modell ausblendet, ist eine der fünf Fragen.",3:"Auch die Grenzen („was nicht?“) gehören zu den fünf Fragen."}},
    {id:"s1-06",s:1,q:"Wie wurde das Fach Wirtschaftswissenschaften historisch bezeichnet?",o:["Politische Ökonomie","Kameralistik der Moderne","Chrematistik","Haushaltslehre"],e:"Der Begriff Politische Ökonomie macht die interdisziplinäre Perspektive deutlich: Wirtschaft im Zusammenhang mit Politik und Gesellschaft.",
      w:{1:"Diesen Begriff gibt es auf den Folien nicht.",2:"Chrematistik ist bei Aristoteles die Geldvermehrung zum Selbstzweck, kein Name des Fachs.",3:"Haushaltsführung ist ein Zusammenhang, in den antike Wirtschaftsfragen eingebettet waren, nicht der Name des Fachs."}},
    {id:"s1-07",s:1,q:"Welche Inhaltsfelder des Kernlehrplans sind besonders ökonomisch ausgerichtet?",o:["Inhaltsfeld 1 (Marktwirtschaftliche Ordnung) und Inhaltsfeld 4 (Wirtschaftspolitik)","Inhaltsfeld 2 und Inhaltsfeld 3","Nur Inhaltsfeld 1","Inhaltsfeld 1 und Inhaltsfeld 5"],e:"IF 1: Marktwirtschaftliche Ordnung, IF 4: Wirtschaftspolitik.",
      w:{1:"Die Folie nennt die Inhaltsfelder 1 und 4.",2:"Die Folie nennt **zwei** Bereiche, neben Inhaltsfeld 1 auch Inhaltsfeld 4 (Wirtschaftspolitik).",3:"Das zweite Feld ist Inhaltsfeld 4 (Wirtschaftspolitik), nicht 5."}},
    {id:"s1-08",s:1,q:"Was untersuchen Wirtschaftswissenschaften laut Vorlesung?",o:["Wie Menschen und Gesellschaften Güter und Ressourcen produzieren, verteilen und verwenden","Ausschließlich das Verhalten von Unternehmen auf Märkten","Nur die Geldpolitik von Zentralbanken","Wie man den Gewinn eines Betriebs maximiert"],e:"Dazu kommt die Frage, wie Wirtschaft, politische Institutionen, Macht und gesellschaftliche Interessen zusammenhängen.",
      w:{1:"„Ausschließlich“ ist zu eng. Es geht um Menschen und Gesellschaften, nicht nur um Unternehmen.",2:"„Nur“ ist zu eng. Geldpolitik ist höchstens ein Teilbereich.",3:"Das ist eine betriebswirtschaftliche Teilfrage, nicht die Definition des Fachs."}},
    {id:"s1-09",s:1,q:"In welchen Zusammenhang waren wirtschaftliche Fragen in der Antike NICHT eingebettet?",o:["Finanzmärkte und Börsenhandel","Ethik/Philosophie","Haushaltsführung","Landwirtschaft"],e:"Eingebettet in Ethik/Philosophie, Politik, Haushaltsführung und Landwirtschaft.",
      w:{1:"Ethik und Philosophie stehen auf der Folie, gehören also dazu.",2:"Haushaltsführung steht auf der Folie, gehört also dazu.",3:"Landwirtschaft steht auf der Folie, gehört also dazu."}},
    {id:"s1-10",s:1,q:"Was war in der Antike die zentrale Produktionseinheit?",o:["Haushalt bzw. Gutshof","Manufaktur","Fabrik","Handelsgesellschaft"],e:"Hintergrund: Agrargesellschaft, Gutshof, Sklaverei, begrenzte Märkte, zunehmende Monetarisierung.",
      w:{1:"Manufakturen gehören in eine spätere Epoche. Die Folie nennt Haushalt und Gutshof.",2:"Fabriken entstehen erst mit der Industrialisierung.",3:"Handel nimmt zu, aber die Märkte sind begrenzt. Produziert wird im Haushalt bzw. auf dem Gutshof."}},
    {id:"s1-11",s:1,q:"Wer betrachtet Arbeitsteilung als Organisation des Haushalts bzw. Gutshofs?",o:["Xenophon","Platon","Aristoteles","Cicero"],e:"Xenophons Fragestellung wirkt „betriebswirtschaftlich“: Wie lässt sich Arbeit sinnvoll organisieren?",
      w:{1:"Platon sieht Arbeitsteilung als **gesellschaftliches** Prinzip, nicht als Organisation eines Hofs.",2:"Aristoteles steht in dieser Sitzung für Geld, Wert und Tausch.",3:"Cicero steht für den Getreidehändler, also für Informationsasymmetrie."}},
    {id:"s1-12",s:1,q:"Wer betrachtet Arbeitsteilung als gesellschaftliches Prinzip?",o:["Platon","Xenophon","Cato","Columella"],e:"Menschen können ihre Bedürfnisse nicht allein befriedigen; Arbeitsteilung erzeugt gegenseitige Abhängigkeit.",
      w:{1:"Xenophon schaut auf den einzelnen Gutshof, also auf die Organisation, nicht auf die Gesellschaft.",2:"Cato steht für kalkulatorische Betriebsführung.",3:"Columella steht für Investitionen im Vergleich zu Alternativen."}},
    {id:"s1-13",s:1,q:"Was erzeugt Arbeitsteilung nach Platon?",o:["Gegenseitige Abhängigkeit","Vollständige Autarkie jedes Haushalts","Steigenden Eigennutz","Sinkende Spezialisierung"],e:"Die Frage verschiebt sich vom einzelnen Haushalt zur Organisation der Gesellschaft.",
      w:{1:"Autarkie heißt Selbstversorgung. Platon sagt gerade, dass niemand alles allein kann.",2:"Eigennutz als Erklärung kommt erst später. Die Antike erklärt Arbeitsteilung (noch) nicht so.",3:"Arbeitsteilung bedeutet mehr Spezialisierung, nicht weniger."}},
    {id:"s1-14",s:1,q:"Wodurch wird Arbeitsteilung in der Antike (noch) NICHT primär erklärt?",o:["Durch Markt, Preise und individuellen Eigennutz","Durch eine Vorstellung gesellschaftlicher Ordnung","Durch unterschiedliche Fähigkeiten","Durch die Organisation des Gutshofs"],e:"Wirtschaftliches Handeln erscheint als Teil der Gesellschaft, nicht als eigenständige Sphäre.",
      w:{1:"Laut Folie ist Arbeitsteilung in der Antike gerade in eine Vorstellung gesellschaftlicher Ordnung eingebettet.",2:"Bei Xenophon erfolgt Arbeitsteilung nach Fähigkeiten und Aufgaben. Das ist also eine antike Erklärung.",3:"Die Organisation des Gutshofs ist Xenophons Erklärung, also antik."}},
    {id:"s1-15",s:1,q:"Was ist Arbeitsteilung?",o:["Aufteilung wirtschaftlicher Tätigkeiten auf unterschiedliche Personen, wodurch Spezialisierung und häufig höhere Produktivität möglich werden","Die gleichmäßige Verteilung des Einkommens","Die Trennung von Haushalt und Staat","Der Tausch von Gütern gegen Geld"],e:"Konzept-Folie zur Arbeitsteilung.",
      w:{1:"Verteilt werden Tätigkeiten, nicht Einkommen.",2:"Das hat mit Arbeitsteilung nichts zu tun. In der Antike gehen Haushalt und Politik sogar ineinander über.",3:"Das beschreibt Geld als Tauschmittel (Aristoteles), nicht Arbeitsteilung."}},
    {id:"s1-16",s:1,q:"Welche Funktion hat Geld nach Aristoteles?",o:["Es erleichtert den Austausch und macht unterschiedliche Güter vergleichbar","Es dient vor allem der Vermögensanhäufung","Es ist entstanden, weil der Staat Steuern eintreiben wollte","Es ersetzt den Wert der Arbeit"],e:"Wichtig: Das ist eine Aussage über den Nutzen von Geld, nicht über seine historische Entstehung.",
      w:{1:"Geld nur zum Anhäufen nennt Aristoteles Chrematistik und sieht das kritisch.",2:"Aristoteles sagt nichts über die Entstehung, sondern fragt nach dem Nutzen.",3:"Davon steht nichts auf den Folien."}},
    {id:"s1-17",s:1,q:"Worüber trifft Aristoteles mit seiner Erklärung von Geld eine Aussage?",o:["Über den Nutzen von Geld","Über die historische Entstehung von Geld","Über die Geldmenge","Über Zinsen"],e:"Die Folie betont: keine Aussage über die Entstehung, sondern eine Frage nach dem Nutzen.",
      w:{1:"Genau das betont die Folie: **keine** Aussage über die historische Entstehung.",2:"Die Geldmenge spielt in dieser Sitzung keine Rolle.",3:"Zinsen kommen in dieser Sitzung nicht vor."}},
    {id:"s1-18",s:1,q:"Was macht Geld nach Aristoteles NICHT wertvoll?",o:["Die Arbeitszeit, die zu seiner Herstellung nötig ist","Gebrauch","Seltenheit","Vergleichbarkeit"],e:"Wertbestimmend: Gebrauch, Austausch, Seltenheit, Vergleichbarkeit.",
      w:{1:"Gebrauch steht auf der Folie, macht Geld also wertvoll.",2:"Seltenheit steht auf der Folie, macht Geld also wertvoll.",3:"Vergleichbarkeit steht auf der Folie, macht Geld also wertvoll."}},
    {id:"s1-19",s:1,q:"Was bezeichnet Aristoteles als Oikonomia?",o:["Wirtschaften zur Bedarfsdeckung","Geldvermehrung zum Selbstzweck","Handel mit fremden Städten","Staatliche Steuerpolitik"],e:"Oikonomia = Bedarfsdeckung; Chrematistik = Geldvermehrung zum Selbstzweck.",
      w:{1:"Das ist das Gegenstück, die Chrematistik.",2:"Davon steht nichts auf den Folien.",3:"Davon steht nichts auf den Folien."}},
    {id:"s1-20",s:1,q:"Was bezeichnet Aristoteles als Chrematistik?",o:["Geldvermehrung zum Selbstzweck","Wirtschaften zur Bedarfsdeckung","Die Lehre vom gerechten Preis","Die Führung des Gutshofs"],e:"Hintergrund: Ist jede Form des Gelderwerbs legitim?",
      w:{1:"Das ist das Gegenstück, die Oikonomia.",2:"Den Begriff „gerechter Preis“ gibt es auf den Folien dieser Sitzung nicht.",3:"Gutshofführung ist das Thema von Xenophon und Cato."}},
    {id:"s1-21",s:1,q:"Was ist eine normative Aussage?",o:["Eine Aussage darüber, wie etwas sein sollte","Eine Aussage darüber, wie etwas ist","Eine statistisch geprüfte Aussage","Eine Aussage über Normen in der Industrie"],e:"Beispiel der Folie: Was ist notwendig für eine gerechte Gesellschaft?",
      w:{1:"Das ist die **positive** Aussage.",2:"Ob statistisch geprüft, spielt für die Unterscheidung keine Rolle.",3:"Wortfalle: „normativ“ meint Wertung (sollen), nicht technische Normen."}},
    {id:"s1-22",s:1,q:"Was ist eine positive Aussage?",o:["Eine Aussage darüber, wie etwas ist bzw. funktioniert","Eine Aussage darüber, wie etwas sein sollte","Eine zustimmende Bewertung","Eine optimistische Prognose"],e:"„Positiv“ heißt hier beschreibend, nicht „gut“.",
      w:{1:"Das ist die **normative** Aussage.",2:"Wortfalle: „positiv“ heißt beschreibend, nicht zustimmend.",3:"Wortfalle: „positiv“ hat hier nichts mit Optimismus zu tun."}},
    {id:"s1-23",s:1,q:"Laut Folie ist „Ist die Gesellschaft gerecht?“ ein Beispiel für …",o:["… eine positive Aussage","… eine normative Aussage","… eine Informationsasymmetrie","… eine Modellannahme"],e:"Die Folie führt „Ist die Gesellschaft gerecht?“ und „Warum ist die Gesellschaft gerecht?“ als positive Beispiele. Normativ ist dagegen: Was ist notwendig für eine gerechte Gesellschaft?",
      w:{1:"Das Wort „gerecht“ verleitet dazu. Die Folie ordnet die Frage aber als positiv ein, weil sie fragt, wie es **ist**.",2:"Hier geht es nicht um ungleich verteiltes Wissen bei einem Tausch.",3:"Hier geht es um die Art der Aussage, nicht um ein Modell."}},
    {id:"s1-24",s:1,q:"Welcher Wandel des ökonomischen Denkens vollzieht sich von der Antike zur Moderne?",o:["Von einem normativen zu einem positiven Verständnis","Von einem positiven zu einem normativen Verständnis","Von der Theorie zur Praxis","Vom Markt zum Haushalt"],e:"In der Antike hängt wirtschaftliches Handeln an der Frage, was ein gutes Leben und eine gute Gesellschaft ausmacht.",
      w:{1:"Genau umgekehrt: Die Antike fragt, wie es sein **soll** (normativ).",2:"Das steht so nicht auf den Folien.",3:"Eher umgekehrt: In der Antike ist der Haushalt zentral."}},
    {id:"s1-25",s:1,q:"Ciceros Getreidehändler weiß, dass morgen viel Getreide eintrifft und der Preis fällt. Welcher moderne Begriff beschreibt das Problem?",o:["Informationsasymmetrie","Opportunitätskosten","Arbeitsteilung","Chrematistik"],e:"Die Beteiligten einer Transaktion sind unterschiedlich gut informiert.",
      w:{1:"Opportunitätskosten sind der entgangene Nutzen einer Alternative. Hier geht es um ungleiches Wissen.",2:"Arbeitsteilung meint Spezialisierung, nicht ungleiches Wissen.",3:"Chrematistik ist Geldvermehrung zum Selbstzweck. Das Kernproblem hier ist aber das Wissen, nicht der Erwerb."}},
    {id:"s1-26",s:1,q:"Mit welchem Beispiel ist Akerlofs „The Market for Lemons“ verbunden?",o:["Gebrauchtwagenmarkt","Getreidehandel im alten Rom","Arbeitsmarkt für Sklaven","Aktienmarkt"],e:"Akerlof (1970): Quality Uncertainty and the Market Mechanism.",
      w:{1:"Der Getreidehandel ist Ciceros Beispiel. Akerlof steht für Gebrauchtwagen.",2:"Davon steht nichts auf den Folien.",3:"Davon steht nichts auf den Folien."}},
    {id:"s1-27",s:1,q:"Was zeigt Ciceros Getreidehändler-Beispiel über Handel?",o:["Handel ist mehr als Preise und Mengen; es geht um Regeln, Wissen und Moral","Handel funktioniert nur mit vollständiger Information","Händler sollen den Preis maximieren","Preise sind immer gerecht"],e:"Folie: Handel ist mehr als Preise und Mengen.",
      w:{1:"Handel findet trotzdem statt. Das Beispiel zeigt nur, dass das Wissen ungleich ist.",2:"Cicero fragt gerade, was ein Händler moralisch darf. Eine Antwort „maximieren“ gibt die Folie nicht.",3:"Die Folie stellt die Frage nach der Moral, sie behauptet keine Gerechtigkeit von Preisen."}},
    {id:"s1-28",s:1,q:"Wie hoch ist bei Platon das Maximalvermögen?",o:["Das Vierfache des Existenzminimums","Das Doppelte des Existenzminimums","Das Zehnfache des Existenzminimums","Es gibt keine Obergrenze"],e:"Der Staat legt ein Existenzminimum fest; alles über dem Vierfachen geht an den Staat bzw. die Schutzgötter.",
      w:{1:"Der Faktor auf der Folie ist vier, nicht zwei.",2:"Der Faktor auf der Folie ist vier, nicht zehn.",3:"Doch: Alles über dem Vierfachen geht an den Staat."}},
    {id:"s1-29",s:1,q:"Was geschieht bei Platon mit Vermögen oberhalb des Maximalvermögens?",o:["Es geht an den Staat bzw. die Schutzgötter","Es wird an die Armen verteilt","Es wird verboten zu erwerben","Es wird in Land investiert"],e:"Platons Gerechtigkeitsmodell.",
      w:{1:"Die Folie nennt den Staat bzw. die Schutzgötter als Empfänger, nicht die Armen.",2:"Von einem Verbot steht nichts auf der Folie. Das Vermögen wird abgegeben.",3:"Davon steht nichts auf der Folie."}},
    {id:"s1-30",s:1,q:"Womit beschäftigt sich Cato in seiner Schrift zur Betriebsführung?",o:["Kosten, Arbeitsorganisation, Auslastung und Eigenproduktion vs. Einkauf","Geld als Tauschmittel","Gerechte Vermögensverteilung","Informationspflichten von Händlern"],e:"Der Gutshof wird kalkulatorisch betrachtet. Moderner Begriff: make or buy.",
      w:{1:"Das ist Aristoteles.",2:"Das ist Platon.",3:"Das ist Cicero."}},
    {id:"s1-31",s:1,q:"Welcher moderne Begriff entspricht der Frage „Produktion selbst oder zukaufen?“",o:["Make or buy","Opportunitätskosten","Arbeitsteilung","Rendite"],e:"Tabelle „Antike und Moderne“.",
      w:{1:"Opportunitätskosten gehören zur Frage „Lohnt sich eine Investition?“.",2:"Arbeitsteilung gehört zu „Spezialisierung von Tätigkeiten“.",3:"Rendite gehört zur Frage „Lohnt sich eine Investition?“."}},
    {id:"s1-32",s:1,q:"Wer betrachtet Investitionen als Verhältnis von Aufwand und erwartetem Ertrag und vergleicht sie mit Alternativen?",o:["Columella","Cato","Xenophon","Aristoteles"],e:"Daraus folgen die Konzepte Rendite und Opportunitätskosten.",
      w:{1:"Cato rechnet auch, aber bei ihm geht es um Kosten, Auslastung und make or buy. Den Vergleich mit Alternativen bringt Columella.",2:"Xenophon steht für die Organisation des Gutshofs.",3:"Aristoteles steht für Geld und Tausch."}},
    {id:"s1-33",s:1,q:"Ertrag 20 €, Kosten 5 €. Wie hoch ist die Rendite nach der Formel der Vorlesung?",o:["300 %","400 %","75 %","15 %"],e:"(20 − 5) / 5 = 3 = 300 %.",
      w:{1:"400 % wäre Ertrag geteilt durch Kosten (20 / 5). Die Kosten müssen erst abgezogen werden.",2:"75 % wäre (20 − 5) / 20. Geteilt wird aber durch die Kosten, nicht durch den Ertrag.",3:"15 ist der Gewinn in Euro (20 − 5), noch nicht ins Verhältnis zu den Kosten gesetzt."}},
    {id:"s1-34",s:1,q:"Ertrag 30 €, Kosten 10 €. Wie hoch ist die Rendite?",o:["200 %","300 %","20 %","66 %"],e:"(30 − 10) / 10 = 2 = 200 %.",
      w:{1:"300 % wäre 30 / 10. Die Kosten müssen erst abgezogen werden.",2:"20 ist der Gewinn in Euro, noch nicht durch die Kosten geteilt.",3:"Rund 66 % wäre (30 − 10) / 30. Geteilt wird durch die Kosten."}},
    {id:"s1-35",s:1,q:"Du kaufst einen Fernseher für 1.000 € statt das Geld zu 4 % p. a. anzulegen. Wie hoch sind die Opportunitätskosten (ein Jahr)?",o:["40 €","1.000 €","1.040 €","4 €"],e:"Entgangener Ertrag der besten Alternative: 4 % von 1.000 € = 40 €.",
      w:{1:"1.000 € ist der Kaufpreis. Opportunitätskosten sind nur der **entgangene Ertrag** der Alternative.",2:"Das wäre Kaufpreis plus Zinsen. Gefragt ist nur der entgangene Ertrag.",3:"4 % von 1.000 € sind 40 €, nicht 4 €."}},
    {id:"s1-36",s:1,q:"Was sind Opportunitätskosten?",o:["Der entgangene Nutzen oder Ertrag der nicht gewählten Alternative","Die direkten Ausgaben für ein Gut","Die Kosten für Informationsbeschaffung","Die Steuern auf einen Gewinn"],e:"Kosten für entgangenen Nutzen bei anderer Verwendung eines Gutes oder Produktionsfaktors.",
      w:{1:"Direkte Ausgaben sind der Preis. Opportunitätskosten entstehen durch den Verzicht auf die Alternative.",2:"Davon steht nichts auf der Folie.",3:"Davon steht nichts auf der Folie."}},
    {id:"s1-37",s:1,q:"Welcher moderne Begriff entspricht dem antiken Problem „Menschen reagieren auf Belohnungen“?",o:["Anreize","Geld und Wert","Informationsasymmetrie","Arbeitsteilung"],e:"Tabelle „Antike und Moderne“.",
      w:{1:"„Geld und Wert“ gehört zu „Tausch benötigt Vergleichbarkeit“.",2:"Informationsasymmetrie gehört zu „Verkäufer wissen mehr als Käufer“.",3:"Arbeitsteilung gehört zu „Spezialisierung von Tätigkeiten“."}},
    {id:"s1-38",s:1,q:"Welcher moderne Begriff entspricht dem antiken Problem „Tausch benötigt Vergleichbarkeit“?",o:["Geld und Wert","Make or buy","Anreize","Steuer- und Transfersysteme"],e:"Tabelle „Antike und Moderne“.",
      w:{1:"Make or buy gehört zu „Produktion selbst oder zukaufen?“.",2:"Anreize gehören zu „Menschen reagieren auf Belohnungen“.",3:"Steuer- und Transfersysteme gehören zu „Was ist eine gerechte Gesellschaft?“."}},
    {id:"s1-39",s:1,q:"Welcher moderne Begriff entspricht der antiken Frage „Was ist eine gerechte Gesellschaft?“",o:["Steuer- und Transfersysteme","Rendite","Arbeitsteilung","Informationsasymmetrie"],e:"Tabelle „Antike und Moderne“.",
      w:{1:"Rendite gehört zu „Lohnt sich eine Investition?“.",2:"Arbeitsteilung gehört zu „Spezialisierung von Tätigkeiten“.",3:"Informationsasymmetrie gehört zu „Verkäufer wissen mehr als Käufer“."}},
    {id:"s1-40",s:1,q:"Welche Aussage über die Antike trifft laut Vorlesung zu?",o:["Antike Autoren stellen ähnliche Fragen, entwickeln aber noch keine geschlossenen ökonomischen Modelle","Die Antike kannte bereits ein ausgearbeitetes Marktmodell","Wirtschaftswissenschaft war in der Antike eine eigenständige Disziplin","Antike Autoren erklärten Arbeitsteilung über Preise und Eigennutz"],e:"Ähnliche Fragestellung ≠ gleiche Theorie.",
      w:{1:"Laut Folie gibt es (noch) keine geschlossenen Modelle des Marktes.",2:"Laut Take-aways gab es sie noch **nicht** als eigenständige Disziplin.",3:"Genau das tun sie (noch) nicht. Arbeitsteilung ist in eine gesellschaftliche Ordnung eingebettet."}},
    {id:"s1-41",s:1,q:"Was ist eine der Take-aways der ersten Sitzung?",o:["Ökonomische Modelle sind historisch entstandene Perspektiven auf Probleme, nicht die Probleme selbst","Ökonomische Probleme sind erst in der Moderne entstanden","Moderne Modelle bilden die Realität vollständig ab","Die Antike ist für heutige Wirtschaftsfragen irrelevant"],e:"Weitere Take-aways: Viele ökonomische Probleme sind sehr alt; keine eigenständige Disziplin in der Antike.",
      w:{1:"Umgekehrt: Viele grundlegende Probleme sind sehr alt.",2:"Kein Modell bildet die Realität vollständig ab, das soll es auch nicht.",3:"Die Antike stellt laut Folie Fragen, die die Wirtschaftswissenschaften bis heute beschäftigen."}},
    {id:"s1-42",s:1,q:"Richtig oder falsch: Ökonomische Modelle entstehen unabhängig von historischen Ereignissen.",o:["Falsch","Richtig"],fix:true,a:0,e:"Grundidee der Vorlesung: Modelle entstehen nicht losgelöst von historischen und gesellschaftlichen Bedingungen.",
      w:{1:"Die Grundidee der Vorlesung sagt das Gegenteil: Modelle sind Reaktionen auf konkrete Probleme ihrer Zeit."}},
    {id:"s1-43",s:1,typ:"multi",q:"Was macht Geld nach Aristoteles wertvoll? (Mehrere Antworten sind richtig.)",o:["Gebrauch","Austausch","Seltenheit","Vergleichbarkeit","Die zu seiner Herstellung nötige Arbeitszeit","Eine staatliche Goldgarantie"],a:[0,1,2,3],e:"Gebrauch, Austausch, Seltenheit, Vergleichbarkeit.",
      w:{4:"Arbeitszeit als Wertquelle steht nicht auf der Folie.",5:"Eine Goldgarantie steht nicht auf der Folie."}},
    {id:"s1-44",s:1,typ:"multi",q:"In welche Zusammenhänge waren wirtschaftliche Fragen in der Antike eingebettet? (Mehrere Antworten sind richtig.)",o:["Ethik/Philosophie","Politik","Haushaltsführung","Landwirtschaft","Finanzmärkte","Industrielle Produktion"],a:[0,1,2,3],e:"Ethik/Philosophie, Politik, Haushaltsführung, Landwirtschaft.",
      w:{4:"Die Märkte der Antike waren begrenzt. Finanzmärkte stehen nicht auf der Folie.",5:"Industrie gibt es erst viel später. Die Antike ist eine Agrargesellschaft."}},
    {id:"s1-45",s:1,typ:"zuord",q:"Ordne den antiken Autoren ihr Thema zu.",paare:[["Xenophon","Arbeitsteilung als Organisation des Gutshofs"],["Platon","Arbeitsteilung als gesellschaftliches Prinzip"],["Aristoteles","Oikonomia und Chrematistik"],["Cicero","Getreidehändler und Informationsasymmetrie"],["Cato","Kosten, Auslastung, make or buy"],["Columella","Investition im Vergleich zu Alternativen"]],e:"Eselsbrücke: Xenophon und Cato schauen auf den **Hof**, Platon auf die **Gesellschaft**, Columella auf die **Alternative**."},
    {id:"s1-46",s:1,typ:"zuord",q:"Ordne dem antiken Problem den modernen Begriff zu.",paare:[["Spezialisierung von Tätigkeiten","Arbeitsteilung"],["Menschen reagieren auf Belohnungen","Anreize"],["Tausch benötigt Vergleichbarkeit","Geld und Wert"],["Verkäufer wissen mehr als Käufer","Informationsasymmetrie"],["Lohnt sich eine Investition?","Rendite/Opportunitätskosten"],["Was ist eine gerechte Gesellschaft?","Steuer- und Transfersysteme"]],e:"Tabelle „Antike und Moderne“."},
    {id:"s1-47",s:1,typ:"zahl",q:"Ertrag 50 €, Kosten 10 €. Wie hoch ist die Rendite in Prozent?",a:400,einheit:"%",e:"(50 − 10) / 10 = 4 = 400 %.",w:"Häufiger Fehler: 500 % (50 / 10, Kosten nicht abgezogen) oder 80 % (durch den Ertrag statt durch die Kosten geteilt)."},
    {id:"s1-48",s:1,typ:"zahl",q:"Statt 2.500 € zu 2 % p. a. anzulegen, kaufst du ein E-Bike. Wie hoch sind die Opportunitätskosten für ein Jahr in Euro?",a:50,einheit:"€",e:"2 % von 2.500 € = 50 €.",w:"Gefragt ist nur der entgangene Zinsertrag, nicht der Kaufpreis und nicht Kaufpreis plus Zinsen."},
    {id:"s1-49",s:1,typ:"zahl",q:"Platons Gedankenexperiment: Das Existenzminimum für eine erwachsene, alleinstehende Person liegt bei 1.008 € im Monat. Wie hoch ist danach das Maximalvermögen pro Monat in Euro?",a:4032,einheit:"€",e:"4 × 1.008 € = 4.032 € (Zahl von der Folie).",w:"Das Maximalvermögen ist das **Vierfache** des Existenzminimums."}
  ],
  karten: [
    {id:"s1-k01",s:1,ctx:"Was ist ein Modell?",f:"Modell",b:"Vereinfachte Darstellung der Realität, mit der bestimmte Zusammenhänge isoliert untersucht werden.\n- soll **nicht** die ganze Realität abbilden\n- soll bestimmte Mechanismen abbilden\nBeispiel: Der U-Bahn-Plan zeigt nur die Stationen, keine Straßen."},
    {id:"s1-k02",s:1,ctx:"Wie man jedes Modell prüft",f:"Fünf Fragen an jedes Modell",b:"1. Welche Frage beantwortet es?\n2. Was nimmt es an?\n3. Was blendet es aus?\n4. Was können wir damit erklären?\n5. Was können wir damit nicht erklären?"},
    {id:"s1-k03",s:1,ctx:"Kernlehrplan SoWi NRW",f:"Fünf Modelle des Kernlehrplans",b:"- Homo oeconomicus\n- Marktmodell\n- Erweiterter Wirtschaftskreislauf\n- Soziales Interaktionsmodell\n- Modell des Konjunkturzyklus\nBesonders ökonomisch: Inhaltsfeld 1 (Marktwirtschaftliche Ordnung) und Inhaltsfeld 4 (Wirtschaftspolitik).",i:"Homo oeconomicus: lateinisch für „wirtschaftender Mensch“."},
    {id:"s1-k04",s:1,ctx:"Der alte Name des Fachs",f:"Politische Ökonomie",b:"Historische Bezeichnung der Wirtschaftswissenschaften.\n- Wirtschaft wird **nicht isoliert** betrachtet\n- sondern im Zusammenhang mit Politik und Gesellschaft (interdisziplinär)",i:"Ökonomie: von griechisch oikos, „Haus“, und nomos, „Gesetz, Regel“."},
    {id:"s1-k05",s:1,ctx:"Wirtschaft in der Antike",f:"Antike: Worin war Wirtschaft eingebettet?",b:"- Ethik/Philosophie\n- Politik\n- Haushaltsführung\n- Landwirtschaft\nHintergrund: Agrargesellschaft, Haushalt bzw. Gutshof als zentrale Produktionseinheit, Sklaverei, begrenzte Märkte, zunehmende Monetarisierung und Handel."},
    {id:"s1-k06",s:1,ctx:"Produktion: Warum spezialisieren sich Menschen?",f:"Xenophon (~400 v. Chr.)",b:"Arbeitsteilung als **Organisation** von Haushalt und Gutshof.\n- nach Fähigkeiten und Aufgaben\n- Führung und Anreize für Beschäftigte bzw. Sklaven\nFrage wirkt „betriebswirtschaftlich“: Wie kann ein Gutshof besser funktionieren?",i:"Eselsbrücke: Xenophon schaut auf den Hof, Platon auf die Gesellschaft."},
    {id:"s1-k07",s:1,ctx:"Produktion: Warum spezialisieren sich Menschen?",f:"Platon: Arbeitsteilung",b:"Arbeitsteilung als **gesellschaftliches Prinzip**.\n- Niemand kann alle Bedürfnisse allein befriedigen.\n- Spezialisierung verteilt Aufgaben in der Gesellschaft.\n- Folge: gegenseitige Abhängigkeit\nDie Frage verschiebt sich vom einzelnen Haushalt zur Gesellschaft."},
    {id:"s1-k08",s:1,ctx:"Gerechtigkeit: Wann ist eine Gesellschaft gerecht?",f:"Platon: gerechte Gesellschaft",b:"1. Der Staat legt ein Existenzminimum fest.\n2. Maximalvermögen = Existenzminimum × 4\n3. Alles darüber geht an den Staat (bzw. die Schutzgötter)."},
    {id:"s1-k09",s:1,ctx:"Konzept",f:"Arbeitsteilung",b:"Aufteilung wirtschaftlicher Tätigkeiten auf unterschiedliche Personen. Dadurch werden Spezialisierung und häufig höhere Produktivität möglich.\nIn der Antike: eingebettet in eine Vorstellung gesellschaftlicher Ordnung, (noch) **nicht** über Markt, Preise und Eigennutz erklärt."},
    {id:"s1-k10",s:1,ctx:"Geld, Wert und gerechter Tausch",f:"Aristoteles: Geld",b:"Warum gibt es Geld?\n- erleichtert den Austausch\n- macht unterschiedliche Güter vergleichbar\nWas macht Geld wertvoll? Gebrauch, Austausch, Seltenheit, Vergleichbarkeit.\nAchtung: Aussage über den **Nutzen**, nicht über die historische Entstehung.",i:"Leseempfehlung der Folie: Graeber, Schulden. Die ersten 5000 Jahre (auf der Folie „Graber“ geschrieben)."},
    {id:"s1-k11",s:1,ctx:"Aristoteles: Ist jeder Gelderwerb legitim?",f:"Oikonomia vs. Chrematistik",b:"| | Oikonomia | Chrematistik\n| Ziel | Bedarfsdeckung | Geldvermehrung zum Selbstzweck\n| Bewertung | legitim | fragwürdig",i:"Oikonomia: von griechisch oikos, „Haus“. Daher kommt „Ökonomie“.\nChrematistik: von griechisch chrēmata, „Geld, Güter“."},
    {id:"s1-k12",s:1,ctx:"Zwei Arten von Aussagen",f:"Normativ vs. positiv",b:"| | Normativ | Positiv\n| Frage | Wie soll es sein? | Wie ist es, wie funktioniert es?\n| Beispiel | Was ist notwendig für eine gerechte Gesellschaft? | Ist die Gesellschaft gerecht?\nWandel von der Antike zur Moderne: von **normativ** zu **positiv**.",i:"Positiv: von lateinisch ponere, „setzen, feststellen“. Gemeint ist beschreibend, nicht „gut“."},
    {id:"s1-k13",s:1,ctx:"Was darf ein Verkäufer verschweigen?",f:"Cicero (~100 v. Chr.)",b:"Ein Getreidehändler weiß: Morgen kommt viel Getreide, der Preis fällt. Muss er das dem heutigen Käufer sagen?\n- Handel ist mehr als Preise und Mengen.\n- Es geht um Regeln, Wissen, Moral.\n- Es herrscht eine **Informationsasymmetrie**."},
    {id:"s1-k14",s:1,ctx:"Konzept",f:"Informationsasymmetrie",b:"Die Beteiligten einer wirtschaftlichen Transaktion sind unterschiedlich gut informiert.\nBeispiel: Gebrauchtwagenmarkt, Akerlof (1970), The Market for Lemons.",i:"Asymmetrie: griechisch „Ungleichmäßigkeit“.\nLemon: englisch für einen schlechten Gebrauchtwagen."},
    {id:"s1-k15",s:1,ctx:"Entscheidungen: Wie führt man einen Gutshof?",f:"Cato (~50 v. Chr.)",b:"Wirtschaftliche Betriebsführung, der Gutshof wird kalkulatorisch betrachtet:\n- Kosten\n- Arbeitsorganisation\n- Auslastung vorhandener Ressourcen\n- Eigenproduktion oder Einkauf (make or buy)\nZentrale Frage: Wie setzt man vorhandene Ressourcen möglichst wirtschaftlich ein?"},
    {id:"s1-k16",s:1,ctx:"Entscheidungen: Lohnt sich eine Investition?",f:"Columella (~50 n. Chr.)",b:"Investition als Verhältnis von:\n- eingesetztem Aufwand und\n- erwartetem Ertrag\nVergleich mit **alternativen** Verwendungen des Kapitals.\nDaraus: Rendite und Opportunitätskosten."},
    {id:"s1-k17",s:1,ctx:"Konzept",f:"Rendite",b:"Ertrag einer Anlage im Verhältnis zu ihren Kosten.\n$ Rendite = (Ertrag − Kosten) / Kosten\nBeispiel: Ertrag: 20 €, Kosten: 5 €\n$ (20 − 5) / 5 = 3 = 300 %"},
    {id:"s1-k18",s:1,ctx:"Konzept",f:"Opportunitätskosten",b:"Entgangener Nutzen oder Ertrag, den ein anderer Einsatz eines Gutes oder Produktionsfaktors gebracht hätte.\nBeispiel: Fernseher für 1.000 € statt Anlage zu 4 % p. a.\n$ 4 % × 1.000 € = 40 €",i:"Opportunität: von lateinisch opportunitas, „Gelegenheit“. Gemeint ist die verpasste Gelegenheit."},
    {id:"s1-k19",s:1,ctx:"Tabelle „Antike und Moderne“",f:"Antikes Problem → moderner Begriff",b:"| Antikes Problem | Moderner Begriff\n| Spezialisierung von Tätigkeiten | Arbeitsteilung\n| Menschen reagieren auf Belohnungen | Anreize\n| Tausch benötigt Vergleichbarkeit | Geld und Wert\n| Verkäufer wissen mehr als Käufer | Informationsasymmetrie\n| Selbst produzieren oder zukaufen? | make or buy\n| Lohnt sich eine Investition? | Rendite/Opportunitätskosten\n| Was ist eine gerechte Gesellschaft? | Steuer- und Transfersysteme"},
    {id:"s1-k20",s:1,ctx:"Zusammenfassung der Sitzung",f:"Take-aways Sitzung 1",b:"- Viele ökonomische Probleme sind sehr alt.\n- Modelle sind historisch entstandene Perspektiven auf Probleme, nicht die Probleme selbst.\n- In der Antike gab es keine eigenständige Wirtschaftswissenschaft.\n- Moderne Begriffe ≠ moderne Theorie: Ähnliche Fragestellung heißt nicht gleiche Theorie."},
    {id:"s1-k21",s:1,ctx:"Gerechtigkeit: Gedankenexperiment der Folie",f:"Platons Grenze, auf heute übertragen",b:"Existenzminimum (Art. 1 Abs. 1 GG):\n- Erwachsene: 12.096 € im Jahr (1.008 € im Monat)\n- Kind: 6.828 € im Jahr (569 € im Monat)\nMaximalvermögen nach Platon (× 4):\n- Erwachsene: 4.032 € im Monat\n- Kind: 2.279 € im Monat (laut Folie)\nFrage der Folie: Ist das gerecht?",i:"Hinweis: 4 × 569 € ergibt 2.276 €. Die Folie nennt 2.279 €; hier gilt die Folie."}
  ]
};

const BASE_SOZ = {
  sitzungen: { "1": "Einführung (15.10.)" },
  karten: [
    {id:"soz1-k01",s:1,ctx:"Was meint „Sozialstruktur“?",f:"Struktur (Glatzer 2002)",b:"Eine Mehrzahl von Einheiten ist **nicht zufällig** angeordnet bzw. verbunden.\n- Es gibt Regelmäßigkeiten oder Muster.\n- Was an einer Stelle auftritt, kehrt an einer anderen wieder."},
    {id:"soz1-k02",s:1,ctx:"Wofür sich die Soziologie interessiert",f:"Soziologie als Verhaltenswissenschaft",b:"Ziel: soziale Phänomene erklären und vorhersagen.\n| | Nicht | Sondern\n| Blick | Verhalten einzelner Menschen | strukturierende Einflüsse, die Handeln systematisch prägen\n| Beispiel | Warum läuft Herr K. Amok? | Welche Bedingungen fördern die Häufigkeit von Amokläufen?"},
    {id:"soz1-k03",s:1,ctx:"Was meint „Sozialstruktur“?",f:"Ziel jeder Sozialstrukturanalyse",b:"Faktoren bestimmen, die Verhalten **systematisch** beeinflussen.\n- Fokus: Muster, verursacht durch offene oder verdeckte soziale Regeln\n- kein Interesse am Einzelfall, sondern an Durchschnittswerten bzw. Wahrscheinlichkeiten\n- Soziale Regeln manifestieren sich in sozialen Strukturen.",i:"Manifestieren: von lateinisch manifestus, „handgreiflich, offenkundig“. Regeln werden in Strukturen sichtbar."},
    {id:"soz1-k04",s:1,ctx:"Wie man in der Sozialstrukturanalyse argumentiert",f:"Goldene Regel",b:"Keine Argumentation mit Einzelfällen!\nUnzulässig: „Raucher sterben nicht früher“, weil Helmut Schmidt (ca. 40 Zigaretten am Tag) 96 wurde.\nZulässig: Überlebensraten britischer Ärzte, Raucher vs. Nichtraucher (Doll et al. 2004)."},
    {id:"soz1-k05",s:1,ctx:"Was meint „Sozialstruktur“?",f:"Wie entsteht Sozialstruktur?",b:"- von Menschen gemacht: Grundlage **und** Ergebnis menschlichen Handelns\n- entsteht durch bewusst oder unbewusst geschaffene, dauerhafte, durchsetzbare Regeln\n- Regeln steuern, ordnen und stabilisieren soziale Prozesse\n- begrenzte Reichweite, historisch und kulturell wandelbar\n- Bestand und Wandel hängen von der Verteilung von Ressourcen (Macht) ab"},
    {id:"soz1-k06",s:1,ctx:"Faktor 1 von 3",f:"Restriktionen",b:"Beschränkungen des individuellen Handlungsspielraums.\n- können enger oder weiter sein\nNatürlich: z. B. Schwerkraft, Klima\nSozial: soziale Regeln, also Normen und Gesetze",i:"Restriktion: von lateinisch restringere, „zurückbinden, einschränken“."},
    {id:"soz1-k07",s:1,ctx:"Faktor 2 von 3",f:"Ressourcen",b:"- mehr (weniger) Ressourcen = mehr (weniger) Macht\n- Restriktionen wirken **in Kombination** mit Ressourcen auf den Handlungsspielraum"},
    {id:"soz1-k08",s:1,ctx:"Faktor 3 von 3",f:"Lebensverlaufsansatz: drei Wechselwirkungen",b:"1. Zwischen Lebensbereichen: Berufliche Entscheidungen fallen im Kontext familialer Entscheidungen.\n2. Vorher-nachher: Frühere Erfahrungen strukturieren aktuelles Verhalten (frühere Arbeitslosigkeit → Angst vor Jobverlust).\n3. Mit dem Verhalten anderer („linked lives“): Eine Partnerschaft besteht nur, wenn beide zustimmen.",i:"Interdependenz: wechselseitige Abhängigkeit.\nLinked lives: englisch für „verbundene Leben“."},
    {id:"soz1-k09",s:1,ctx:"Die drei generellen Faktoren",f:"Drei Faktoren der Sozialstrukturanalyse",b:"1. Restriktionen\n2. Ressourcen\n3. Lebensverlauf",i:"Eselsbrücke: „R-R-L“: Was darf ich? Was habe ich? Was habe ich schon erlebt?"},
    {id:"soz1-k10",s:1,ctx:"Was meint „Sozialordnung“?",f:"Sozialordnung",b:"Gesellschaften müssen festlegen:\n- Verhaltensregeln („Spielregeln“)\n- Kriterien der Ressourcenverteilung\nDie Sozialordnung soll sorgen für:\nEffizienz: keine Ressourcen verschwenden\nGerechtigkeit: Ressourcen gerecht verteilen"},
    {id:"soz1-k11",s:1,ctx:"Sozialstruktur, Sozialordnung und Ungleichheit",f:"Soziale Ungleichheit",b:"Eng verbunden mit Sozialstruktur und Sozialordnung.\n- nicht per se gut oder schlecht\n- immer verbunden mit Fragen der Motivation und Gerechtigkeit\n- relevant für die praktische Sozialpolitik"},
    {id:"soz1-k12",s:1,ctx:"Ursprung der Sozialstrukturanalyse",f:"Seit wann gibt es Sozialstruktur?",b:"- In frühen Gruppen: unterschiedliche Funktionen und eine Verteilung von Ressourcen, aber eher **interne Gruppenstruktur**.\n- Von Sozialstruktur spricht man erst mit größeren, komplexeren Gesellschaften seit der Antike."},
    {id:"soz1-k13",s:1,ctx:"Vormoderne Gesellschaften",f:"Stände (Schäfers/Kopp 2006)",b:"Soziale Gruppierungen mit spezifischen Rechten (Privilegien) und Pflichten, deren ungleicher Status **rechtlich abgesichert** ist.\nEntscheidend für Stand und Lebenschancen: die soziale Herkunft.\nUm 1795: Adel, Geistlichkeit, Bürgertum (z. B. Handwerker), einfaches Volk (Bauern, Arbeiter).",i:"Privileg: von lateinisch privilegium, „Sonderrecht“."},
    {id:"soz1-k14",s:1,ctx:"Ursprung der Sozialstrukturanalyse",f:"Merkmale moderner Gesellschaften",b:"- rationale Lebensführung, zunehmende Selbstkontrolle\n- erfahrungswissenschaftlicher und technischer Fortschritt\n- soziale Mobilität\n- Säkularisierung\n- Ausdifferenzierung funktionsspezifischer Subsysteme\n- Pluralisierung\n- Individualisierung\n- später: Industrialisierung",i:"Säkularisierung: von lateinisch saeculum, „Zeitalter, Welt“. Religion verliert an gesellschaftlichem Einfluss."},
    {id:"soz1-k15",s:1,ctx:"Deutschland im 19. Jahrhundert",f:"Voraussetzungen der Industrialisierung",b:"- Aufhebung feudaler Abhängigkeiten („Bauernbefreiung“)\n- Berufs- und Niederlassungsfreiheit, mehr Mobilität\n- Bevölkerungswachstum\n- steigender Bildungsstand\n- Trennung von Arbeits- und Wohnort, Wandel der Familie\n- (späte) Nationalstaatsgründung bzw. Zollunion\n- (späte) Demokratisierung, Sozialversicherungen"},
    {id:"soz1-k16",s:1,ctx:"Ursprung der Sozialstrukturanalyse",f:"Modernisierung",b:"1. (vormoderne) Agrargesellschaft\n2. (moderne) Industriegesellschaft\n3. (postmoderne?) Dienstleistungsgesellschaft (?)\nSpätestens seit dem 19. Jh. ändert sich die Sozialstruktur grundlegend.\nOffene Frage: Wie beschreibt man die (post-)moderne Gesellschaft am besten?"},
    {id:"soz1-k17",s:1,ctx:"Traditionelle Sozialstrukturanalyse",f:"Karl Marx (1818–1883): Klassengesellschaft",b:"Hintergrund: Industrialisierung, wenige wohlhabende Fabrikanten, viele arme Arbeiter.\n- **eine** Ungleichheitsdimension: Besitz von Produktionsmitteln („Kapital“)\n- zwei Klassen: Bourgeoisie vs. Proletariat\n- Arbeiter müssen ihre Arbeitskraft verkaufen, werden ausgebeutet, sind fremdbestimmt\n- Klassen stehen sich antagonistisch gegenüber (Klassenkonflikt)",i:"Bourgeoisie: französisch „Bürgertum“.\nProletariat: von lateinisch proles, „Nachkommen“; die Ärmsten besaßen nur ihre Kinder.\nAntagonistisch: unversöhnlich gegensätzlich."},
    {id:"soz1-k18",s:1,ctx:"Traditionelle Sozialstrukturanalyse",f:"Max Weber (1864–1920)",b:"**Drei** Ungleichheitsdimensionen:\nKlasse: Besitz von Kapital und Wissen\nStand: Grad des sozialen Prestiges (Ansehen)\nPartei: Potenzial, Gruppeninteressen zu organisieren (soziale Konfliktfähigkeit)",i:"Eselsbrücke: Marx zählt eins, Weber zählt drei."},
    {id:"soz1-k19",s:1,ctx:"Traditionelle Sozialstrukturanalyse",f:"Schichtmodelle",b:"| Modell | Bezug\n| Bolte-Zwiebel (Bolte/Kappe/Neidhardt 1967) | Westdeutschland, 1960er\n| Haus-Modell von Dahrendorf (1965) | Westdeutschland, 1960er\n| Haus-Modell (Geißler 2008) | Deutschland, 2000"},
    {id:"soz1-k20",s:1,ctx:"Traditionelle Sozialstrukturanalyse",f:"Grenzen von Klassen- und Schichtmodellen",b:"- nur **vertikale** Ungleichheit: Beruf, Qualifikation, ökonomische Lage\n- **horizontale** Ungleichheit fehlt: Geschlecht, Alter, Generation, Region\n- Mentalitäten und Lebensstile innerhalb von Klassen/Schichten kaum berücksichtigt\nDaher seit den 1970er/80er Jahren: Lebenslage – Lebensstil – Milieu.",i:"Vertikal: oben und unten. Horizontal: nebeneinander, ohne Rangfolge."},
    {id:"soz1-k21",s:1,ctx:"Zwei Strömungen der Sozialstrukturanalyse",f:"Traditionelle vs. Neue Sozialstrukturanalyse",b:"| | Traditionell | Neu\n| Zentral | Großgruppen (Klassen, Schichten, Lebenslagen) | Indikatoren (Alter, Bildung, Geschlecht), die individuelles Handeln strukturieren\n| Prämisse | Handeln ist Produkt gesellschaftlicher Strukturen | gesellschaftliches Handeln ist Produkt strukturierten individuellen Handelns",i:"Prämisse: Grundannahme, von der man ausgeht."},
    {id:"soz1-k22",s:1,ctx:"Handlungstheoretische Kontroverse",f:"Homo sociologicus vs. Homo oeconomicus",b:"| | Homo sociologicus | Homo oeconomicus\n| Bild | „Rädchen im Getriebe“ | „seines Glückes Schmied“\n| Mensch | Spielball sozialer Gegebenheiten | vollkommen rationaler Akteur\n| Position | durch Rollenerwartungen | durch Talent und Präferenzen\n| Sozialstruktur | reproduziert sich selbst bzw. wird von Eliten bestimmt | ergibt sich aus freien Handlungen\nBeide sind Pole eines **idealtypischen Kontinuums**.",i:"Idealtypisch: gedanklich zugespitzt, in Reinform kommt das in der Wirklichkeit nicht vor."},
    {id:"soz1-k23",s:1,ctx:"Handlungstheoretische Kontroverse",f:"Einordnung auf dem Kontinuum",b:"Von gruppenzentriert nach akteurszentriert:\n1. Traditionelle Sozialstrukturanalyse (Klasse, Schicht, Lebenslage, Lebensstil, Milieu)\n2. Neue Sozialstrukturanalyse\n3. Neoklassische bzw. neoliberale Ökonomie"},
    {id:"soz1-k24",s:1,ctx:"Organisatorisches",f:"Was ist klausurrelevant?",b:"Vor allem die Ausführungen in der Vorlesung und die Folien.\nDringend empfohlen: parallel das Lehrbuch Erlinghagen & Hank (2018), Neue Sozialstrukturanalyse (zu Sitzung 1: Kapitel 1, S. 13–28)."}
  ],
  /* Schreibaufgaben: k = Erwartungshorizont (je 1 Punkt), m = Musterlösung gegliedert mit 1) 2) 3), Kernbegriffe **fett** */
  aufgaben: [
    {id:"soz1-a01",s:1,q:"Erläutern Sie, was in der Soziologie unter „Sozialstruktur“ verstanden wird und warum die Sozialstrukturanalyse nicht mit Einzelfällen argumentiert.",
      k:["Struktur als nicht zufällige Anordnung bzw. Verbindung von Einheiten; Regelmäßigkeiten und Muster (Glatzer)","Soziologie interessiert sich nicht für das Verhalten Einzelner, sondern für strukturierende Einflüsse (z. B. Amok-Beispiel)","Ziel: Faktoren bestimmen, die Verhalten systematisch beeinflussen","Interesse an Durchschnittswerten bzw. Wahrscheinlichkeiten statt am Einzelfall","Soziale Regeln manifestieren sich in sozialen Strukturen","Beispiel: Helmut Schmidt als unzulässiger Einzelfall vs. Überlebensraten von Rauchern (Doll et al. 2004)"],
      m:"1) **Begriff:** Sozialstruktur meint **Regelmäßigkeiten und Muster**. Einheiten sind nicht zufällig angeordnet, sodass Wiederkehrendes erwartbar ist (Glatzer 2002).\n2) **Blickrichtung:** Die Soziologie fragt nicht, warum ein Einzelner handelt (Herr K.), sondern welche gesellschaftlichen Bedingungen Handeln **systematisch** beeinflussen (Häufigkeit von Amokläufen).\n3) **Ziel:** Die Sozialstrukturanalyse sucht Faktoren, die Verhalten im **Durchschnitt** bzw. mit bestimmter **Wahrscheinlichkeit** prägen. Die sichtbare Struktur ist Ausdruck wirksamer **sozialer Regeln**.\n4) **Keine Einzelfälle:** Ein Einzelfall widerlegt keinen Zusammenhang. Dass Helmut Schmidt trotz starken Rauchens alt wurde, sagt nichts gegen die höhere Sterblichkeit von Rauchern (Ärztestudie, Doll et al. 2004)."},
    {id:"soz1-a02",s:1,q:"Erklären Sie die drei generellen Faktoren der Sozialstrukturanalyse und wie sie zusammenwirken.",
      k:["Restriktionen als Begrenzung des Handlungsspielraums; enger oder weiter","Restriktionen natürlicher Art (Schwerkraft, Klima) und sozialer Art (Normen, Gesetze)","Ressourcen: mehr Ressourcen bedeuten mehr Macht","Restriktionen und Ressourcen wirken in Kombination auf den Handlungsspielraum","Lebensverlauf: Wechselwirkungen zwischen Lebensbereichen (z. B. Beruf und Familie)","Lebensverlauf: Vorher-nachher-Wechselwirkungen und „linked lives“"],
      m:"1) **Restriktionen** begrenzen den Handlungsspielraum. Sie sind **natürlich** (Klima, Schwerkraft) oder **sozial** (Normen, Gesetze), enger oder weiter.\n2) **Ressourcen** bedeuten **Macht**: Wer mehr hat, hat mehr Spielraum.\n3) **Zusammenwirken:** Restriktionen wirken **in Kombination** mit Ressourcen. Mit vielen Ressourcen lassen sich Beschränkungen eher überwinden.\n4) **Lebensverlauf:** Entscheidungen hängen **zwischen Lebensbereichen** zusammen (Beruf und Familie), **frühere Erfahrungen** prägen heutiges Verhalten (frühere Arbeitslosigkeit, Angst vor Jobverlust), und sie hängen vom Handeln **anderer** ab (linked lives, z. B. Partnerschaft)."},
    {id:"soz1-a03",s:1,q:"Vergleichen Sie die Klassenkonzepte von Karl Marx und Max Weber.",
      k:["Marx: historischer Kontext Industrialisierung, wenige Fabrikanten vs. viele arme Arbeiter","Marx: eine Ungleichheitsdimension, Besitz von Produktionsmitteln","Marx: zwei Klassen, Bourgeoisie und Proletariat","Marx: Ausbeutung, Fremdbestimmung, antagonistischer Klassenkonflikt","Weber: drei Ungleichheitsdimensionen","Weber: Klasse = Besitz von Kapital und Wissen","Weber: Stand = soziales Prestige; Partei = Organisation von Gruppeninteressen","Fazit: Marx eindimensional, Weber mehrdimensional und differenzierter"],
      m:"1) **Marx – Kontext:** Industrialisierung im 19. Jahrhundert, wenige wohlhabende Fabrikanten, viele arme Arbeiter.\n2) **Marx – Modell:** Die Position bestimmt sich über **eine** Dimension, den **Besitz von Produktionsmitteln**. Daraus folgen zwei Klassen: **Bourgeoisie** und **Proletariat**. Die Arbeiter müssen ihre Arbeitskraft verkaufen und werden ausgebeutet. Die Klassen stehen sich **antagonistisch** gegenüber.\n3) **Weber – Modell:** **Drei** Dimensionen: **Klasse** (Kapital und Wissen), **Stand** (soziales Prestige) und **Partei** (Fähigkeit, Gruppeninteressen zu organisieren).\n4) **Vergleich:** Marx erfasst Ungleichheit **eindimensional** über die ökonomische Lage, Weber **mehrdimensional** und damit differenzierter."},
    {id:"soz1-a04",s:1,q:"Erläutern Sie die Grenzen von Klassen- und Schichtmodellen und welche Ansätze daraus hervorgegangen sind.",
      k:["Klassen- und Schichtmodelle erfassen vor allem vertikale Ungleichheit (Beruf, Qualifikation, ökonomische Lage)","Horizontale Ungleichheiten fehlen (Geschlecht, Alter, Generation, Region)","Mentalitäten und Lebensstile innerhalb von Klassen/Schichten werden kaum berücksichtigt","Beispiele für Schichtmodelle: Bolte-Zwiebel, Haus-Modell von Dahrendorf bzw. Geißler","Neuere Ansätze seit den 1970er/80er Jahren: Lebenslage, Lebensstil, Milieu"],
      m:"1) **Beispiele:** Schichtmodelle wie die **Bolte-Zwiebel** oder das **Haus-Modell** (Dahrendorf, Geißler) ordnen die Bevölkerung nach oben und unten.\n2) **Grenze 1:** Sie erfassen nur **vertikale** Ungleichheit (Beruf, Qualifikation, ökonomische Lage).\n3) **Grenze 2:** **Horizontale** Ungleichheiten wie Geschlecht, Alter, Generation oder Region fehlen.\n4) **Grenze 3:** **Mentalitäten und Lebensstile** innerhalb einer Schicht werden kaum abgebildet.\n5) **Folge:** Seit den 1970er/80er Jahren entstehen Konzepte der **Lebenslage**, des **Lebensstils** und des **Milieus**."},
    {id:"soz1-a05",s:1,q:"Stellen Sie die traditionelle und die Neue Sozialstrukturanalyse gegenüber und ordnen Sie beide auf dem Kontinuum zwischen Homo sociologicus und Homo oeconomicus ein.",
      k:["Traditionell: Identifikation gesellschaftlich relevanter Großgruppen (Klassen, Schichten, Lebenslagen)","Traditionell: Prämisse, Handeln ist Produkt gesellschaftlicher Strukturen","Neu: Identifikation von Indikatoren (Alter, Bildung, Geschlecht), die individuelles Handeln strukturieren","Neu: Prämisse, gesellschaftliches Handeln ist Produkt strukturierten individuellen Handelns","Homo sociologicus: „Rädchen im Getriebe“, Position durch Rollenerwartungen bestimmt","Homo oeconomicus: „seines Glückes Schmied“, rationaler Akteur, Position durch Talent und Präferenzen","Einordnung: traditionelle SSA gruppenzentriert nahe Homo sociologicus, Neue SSA dazwischen, neoklassische Ökonomie am akteurszentrierten Pol","Hinweis, dass es sich um ein idealtypisches Kontinuum handelt"],
      m:"1) **Traditionelle Sozialstrukturanalyse:** sucht **Großgruppen** (Klassen, Schichten, Lebenslagen). Prämisse: Handeln ist ein Produkt **gesellschaftlicher Strukturen**.\n2) **Neue Sozialstrukturanalyse:** sucht **Indikatoren** wie Alter, Bildung oder Geschlecht, die individuelles Handeln strukturieren. Prämisse: Gesellschaftliches Handeln ist ein Produkt **strukturierten individuellen Handelns**.\n3) **Pole:** Der **Homo sociologicus** ist das „Rädchen im Getriebe“, seine Position ist durch Rollenerwartungen festgelegt. Der **Homo oeconomicus** ist der rationale Akteur und „seines Glückes Schmied“.\n4) **Einordnung:** Die traditionelle Analyse liegt am **gruppenzentrierten** Pol, die Neue Sozialstrukturanalyse **in der Mitte**, die neoklassische Ökonomie am **akteurszentrierten** Pol. Das Kontinuum ist **idealtypisch**."},
    {id:"soz1-a06",s:1,q:"Erläutern Sie, was eine Sozialordnung leisten muss und in welchem Verhältnis sie zu sozialer Ungleichheit steht.",
      k:["Gesellschaften müssen Verhaltensregeln („Spielregeln“) festlegen","Gesellschaften müssen Kriterien der Ressourcenverteilung festlegen","Ziel Effizienz: keine Ressourcen verschwenden","Ziel Gerechtigkeit: Ressourcen gerecht verteilen","Soziale Ungleichheit ist nicht per se gut oder schlecht; verbunden mit Motivation und Gerechtigkeit; relevant für Sozialpolitik"],

function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

function initToken(){
  const m = location.hash.match(/[#&]t=([A-Za-z0-9_]+)/);
  if(m){ lsSet(GH.tokenKey, m[1]); try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){} }
  ghToken = lsGet(GH.tokenKey);
}
const ghHeaders = () => ({"Authorization":"Bearer "+ghToken,"Accept":"application/vnd.github+json"});
const b64enc = str => btoa(unescape(encodeURIComponent(str)));
const b64dec = str => decodeURIComponent(escape(atob(str.replace(/\n/g,""))));

async function pull(){
  if(!ghToken) return null;
  const r = await fetch(GH.api+"?ref="+GH.branch+"&_="+Date.now(), {headers:ghHeaders(), cache:"no-store"});
  if(r.status===404){ remoteSha=null; return {}; }
  if(r.status===401){ syncStatus="schluessel"; return null; }
  if(!r.ok) throw new Error(r.status);
  const d = await r.json(); remoteSha = d.sha;
  return JSON.parse(b64dec(d.content));
}
async function push(){
  if(!ghToken) return;
  if(pushing){ pushAgain=true; return; }
  pushing=true;
  try{
    for(let attempt=0; attempt<2; attempt++){
      const body={message:"Lernstand", branch:GH.branch, content:b64enc(JSON.stringify(state))};
      if(remoteSha) body.sha=remoteSha;
      const r = await fetch(GH.api, {method:"PUT", headers:ghHeaders(), body:JSON.stringify(body)});
      if(r.ok){ const d=await r.json(); remoteSha=d.content.sha; syncStatus="ok"; lastSync=new Date(); break; }
      if(r.status===401){ syncStatus="schluessel"; break; }
      if(r.status===409||r.status===422){ await pull(); continue; }  // veraltete Version: neu holen und nochmal
      syncStatus="fehler"; break;
    }
  }catch(e){ syncStatus="fehler"; }
  pushing=false;
  if(pushAgain){ pushAgain=false; push(); }
}
function schedulePush(){ if(!ghToken) return; clearTimeout(pushTimer); pushTimer=setTimeout(push, 1500); }
function flushPush(){ if(pushTimer){ clearTimeout(pushTimer); pushTimer=null; push(); } }

/* Neuerer Stand gewinnt: Vergleich über den Zeitstempel "updated" */
async function syncFromRemote(){
  if(!ghToken) return false;
  try{
    const remote = await pull();
    if(remote===null) return false;
    if(remote.updated && remote.updated > (state.updated||0)){
      state = Object.assign(state, remote); lsSet(KEY, JSON.stringify(state));
      syncStatus="ok"; lastSync=new Date(); return true;
    }
    if((state.updated||0) > (remote.updated||0)) await push();
    else { syncStatus="ok"; lastSync=new Date(); }
  }catch(e){ syncStatus="fehler"; }
  return false;
}

/* ===== Textformat (aus Wirtschaft II übernommen, aufs Fach angepasst) =====
   Schreibweise in Karten-Rückseiten (b), Musterlösungen (m), Erklärungen:
   - "- " Aufzählung, "1. " oder "1) " nummerierte Schritte
   - "Begriff: Erklärung" (Begriff höchstens 42 Zeichen) wird Begriff fett, Erklärung daneben
   - "$ Formel" wird Formelbox, die umbricht
   - "| Kopf | A | B" (mehrere Zeilen) wird Vergleichstabelle, auf dem Handy gestapelt
   - **fett**; Klammern mit Wörtern werden leiser gesetzt; Zahl und Einheit bleiben zusammen */
const nb=s=>String(s).replace(/v\. Chr\./g,"v.&nbsp;Chr.").replace(/n\. Chr\./g,"n.&nbsp;Chr.").replace(/(\d) (%|€|Euro|Prozentpunkte|Punkte|Punkten|Tage|Tagen|Minuten|Min\.|Jahre|Jh\.|v\.&nbsp;Chr\.|n\.&nbsp;Chr\.)/g,"$1&nbsp;$2").replace(/([×=−+/]) (\d)/g,"$1&nbsp;$2");
const quietParens=s=>s.replace(/\(([^()]{2,})\)/g,(m,x)=>/^[A-Za-zÄÖÜäöüß„]/.test(x)&&/[A-Za-zÄÖÜäöüß]{3,}/.test(x)&&!/[=+−·<>\/]/.test(x)?`<span class="pz">(${x})</span>`:m);
const inl=s=>quietParens(nb(String(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")));
const TERM=/^([^:=⇒?|]{1,42}): (.+)$/;
function cmpTable(rows){
  const h=rows[0], body=rows.slice(1);
  const tight=rows.every(r=>r.every(c=>String(c).replace(/\*\*/g,"").length<=18));
  return `<table class="cmp${tight?" tight":""}"><thead><tr>${h.map(x=>`<th>${inl(x)}</th>`).join("")}</tr></thead><tbody>${body.map(r=>`<tr><th scope="row">${inl(r[0])}</th>${r.slice(1).map((c,j)=>`<td data-l="${esc(String(h[j+1]||"").replace(/\*\*/g,""))}"><span>${inl(c)}</span></td>`).join("")}</tr>`).join("")}</tbody></table>`;
}
function termInline(x){ const m=x.match(TERM); return m?`<b>${inl(m[1])}:</b> ${inl(m[2])}`:inl(x); }
function richText(b){
  const L=String(b).split("\n"); let out="", kind=null, items=[];
  const flush=()=>{ if(!kind) return;
    if(kind==="dl") out+=`<div class="dlist">${items.join("")}</div>`;
    else out+=`<${kind}>${items.map(x=>`<li>${x}</li>`).join("")}</${kind}>`;
    kind=null; items=[]; };
  const open=k=>{ if(kind!==k){ flush(); kind=k; } };
  for(let i=0;i<L.length;i++){ const l=L[i].trim(); let m;
    if(!l){ flush(); continue; }
    if((m=l.match(/^\$ ?(.*)$/))){ const box=`<div class="eq">${nb(m[1])}</div>`;
      if((kind==="ol"||kind==="ul")&&items.length) items[items.length-1]+=box; else { flush(); out+=box; } continue; }
    if(l.startsWith("|")){ flush(); const rows=[];
      while(i<L.length&&L[i].trim().startsWith("|")){ rows.push(L[i].trim().replace(/^\||\|$/g,"").split("|").map(x=>x.trim())); i++; }
      i--; out+=cmpTable(rows); continue; }
    if((m=l.match(/^[-•] (.*)$/))){ open("ul"); items.push(termInline(m[1])); continue; }
    if((m=l.match(/^\d+[.)] (.*)$/))){ open("ol"); items.push(termInline(m[1])); continue; }
    if((m=l.match(TERM))){ open("dl"); items.push(`<b>${inl(m[1])}</b><span>${inl(m[2])}</span>`); continue; }
    flush(); out+=`<p>${inl(l)}</p>`;
  }
  flush(); return out;
}
/* Dezentes „i“: Herkunft eines Begriffs oder Eselsbrücke */
function infoHTML(t){
  if(!t) return "";
  const lines=String(t).split("\n").map(l=>{ const m=l.match(/^([^:]{1,32}): (.*)$/); return m?`<span class="cl"><b>${inl(m[1])}</b> ${inl(m[2])}</span>`:`<span class="cl">${inl(l)}</span>`; }).join("");
  return `<div class="cinfo"><span class="ci" aria-hidden="true">i</span><div>${lines}</div></div>`;
}

/* ===== Wiederholungsplan für Karten (wie Anki) =====
   Fach (state.box) 1–5 wie bisher. Gewusst: Fach +1, nächste Abfrage nach INTERVAL[Fach] Tagen;
   in Fach 5 erneut gewusst: 35 Tage. Nicht gewusst: Fach 1, sofort noch einmal. */
const INTERVAL=[0,0,1,3,7,16];
const dayStart=(t=Date.now())=>{ const d=new Date(t); d.setHours(0,0,0,0); return d.getTime(); };
function allCardsBoth(){ return mergeById(BASE.karten,state.custom.karten).concat(mergeById(BASE_SOZ.karten,state.soz.karten)); }
function norm(){
  for(const k of ["box","due","err","unclear","schreiben","entwurf"]) if(!state[k]||typeof state[k]!=="object") state[k]={};
  if(!state.soz) state.soz={sitzungen:{},karten:[]};
  /* Übernahme der alten Leitner-Fächer: Karten ohne Termin bekommen einen Termin passend zu ihrem Fach,
     gerechnet ab dem letzten Lerntag. Nichts wird gelöscht. */
  const base=dayStart(state.updated||Date.now());
  allCardsBoth().forEach(c=>{ const b=state.box[c.id]; if(b && state.due[c.id]==null) state.due[c.id]=base+INTERVAL[Math.min(b,5)]*864e5; });
}
const isSeen=id=>!!state.box[id];
const isDue=id=>isSeen(id) && (state.due[id]||0)<=Date.now();
function dueCards(items){ return (items||allK()).filter(x=>isDue(x.id)).sort((a,b)=>(state.due[a.id]||0)-(state.due[b.id]||0)); }
function gradeCard(c,ok,free){
  const b0=boxOf(c.id), b1=ok?Math.min(5,Math.max(b0,1)+1):1;
  state.box[c.id]=b1;
  if(!free||!ok||b1<b0) state.due[c.id]= ok ? dayStart()+(b0===5?35:INTERVAL[b1])*864e5 : Date.now();
}
const whenText=t=>{ const d=Math.round((dayStart(t)-dayStart())/864e5); return d<=0?"heute":d===1?"morgen":"in "+d+" Tagen"; };
function grade(id, ok){
  const b=boxOf(id); state.box[id] = ok ? Math.min(5, Math.max(b,1)+1) : 1;
  if(!state.err) state.err={};
  if(!ok) state.err[id]=1; else if(state.box[id]>=4) delete state.err[id];
}
function weightedPick(items, avoidId){
  const pool = items.length>1 ? items.filter(x=>x.id!==avoidId) : items;
  const w = pool.map(x=>[6,5,4,3,2,1][boxOf(x.id)]);
  let r = Math.random()*w.reduce((a,b)=>a+b,0);
  for(let i=0;i<pool.length;i++){ r-=w[i]; if(r<=0) return pool[i]; }
  return pool[pool.length-1];
}
/* Fragetypen: sc = eine richtige (Standard), multi = mehrere richtige, zuord = Zuordnung, zahl = Zahleneingabe */
const qType = q => q.typ || "sc";
function prepQ(q){
  const t=qType(q);
  if(t==="zuord") return {q,t,order:shuffle(q.paare.map((_,i)=>i)),rights:shuffle(q.paare.map(x=>x[1]))};
  if(t==="zahl") return {q,t};
  const idx=q.o.map((_,i)=>i);
  return {q,t,order:q.fix?idx:shuffle(idx),correct:t==="multi"?q.a:(Number.isInteger(q.a)?q.a:0)};
}
const numOf = v => { let t=String(v).trim().replace(/\s|€|%/g,""); if(t.includes(",")) t=t.replace(/\./g,"").replace(",","."); else if(/^\d{1,3}(\.\d{3})+$/.test(t)) t=t.replace(/\./g,""); return parseFloat(t); };
function isAnswered(p,a){
  if(a===null||a===undefined) return false;
  if(p.t==="multi") return a.length>0;
  if(p.t==="zuord") return a.some(Boolean);
  if(p.t==="zahl") return String(a).trim()!=="";
  return true;
}
function isRight(p,a){
  if(!isAnswered(p,a)) return false;
  if(p.t==="multi"){ const x=a.slice().sort().join(), y=p.correct.slice().sort().join(); return x===y; }
  if(p.t==="zuord") return p.q.paare.every((pr,i)=>a[i]===pr[1]);
  if(p.t==="zahl") return Math.abs(numOf(a)-p.q.a)<=(p.q.tol||0)+1e-9;
  return a===p.correct;
}
function correctText(p){
  if(p.t==="multi") return p.correct.map(i=>p.q.o[i]).join("; ");
  if(p.t==="zuord") return p.q.paare.map(x=>x[0]+" → "+x[1]).join("; ");
  if(p.t==="zahl") return p.q.a+(p.q.einheit?" "+p.q.einheit:"");
  return p.q.o[p.correct];
}
function answerText(p,a){
  if(!isAnswered(p,a)) return "keine";
  if(p.t==="multi") return a.map(i=>p.q.o[i]).join("; ");
  if(p.t==="zuord") return p.q.paare.map((x,i)=>x[0]+" → "+(a[i]||"?")).join("; ");
  if(p.t==="zahl") return a+(p.q.einheit?" "+p.q.einheit:"");
  return p.q.o[a];
}
const typeHint = p => ({multi:"Mehrere Antworten können richtig sein.",zuord:"Ordne jedem Begriff das Passende zu.",zahl:"Gib eine Zahl ein."})[p.t]||"";
function answerHTML(p,a,reveal,idk){

        ${reveal&&!ok?`<span class="small" style="display:block;margin-top:4px">Richtig: ${inl(pr[1])}</span>`:""}</label>`; }).join("")}</div>`;

      <span>${esc(p.q.einheit||"")}</span></div>`;
  }
  const multi=p.t==="multi", sel=multi?(a||[]):[a];
  return `<div class="opts">${p.order.map(i=>{
    const isSel=sel.includes(i), isC=multi?p.correct.includes(i):i===p.correct;
    let c="opt", tag="";
    if(reveal){
      if(idk){ if(isC) c+=" right"; }
      else if(multi){
        if(isSel&&isC){ c+=" right"; tag="richtig angekreuzt"; }
        else if(isSel){ c+=" wrong"; tag="falsch angekreuzt"; }
        else if(isC){ c+=" miss"; tag="nicht angekreuzt, gehört aber dazu"; }
      } else { if(isC) c+=" right"; else if(isSel) c+=" wrong"; }
    } else if(isSel) c+=" sel";
    return `<button class="${c}" data-o="${i}"${dis}>${multi?(isSel?"☑ ":"☐ "):""}${inl(p.q.o[i])}${tag?`<span class="tag">${tag}</span>`:""}</button>`; }).join("")}</div>`;
}
/* Rückmeldung: warum genau diese Wahl falsch ist und was den Unterschied macht.
   q.w = {Index der falschen Option: Begründung} (Index wie in q.o), bei Zahlenfragen ein Text zum typischen Fehler. */
function fbHTML(p,a,idk){
  const q=p.q, w=q.w||{}, why=q.e?inl(q.e):"";
  const right=`<b>Richtig</b><span>${inl(correctText(p))}</span>`;
  if(idk) return `<div class="fb idk"><p class="fh">Kein Problem, die Frage kommt gleich noch einmal.</p><div class="dlist">${right}${why?`<b>Warum</b><span>${why}</span>`:""}</div></div>`;
  if(isRight(p,a)) return `<div class="fb good"><p class="fh">Richtig.</p>${why?`<p style="margin:0">${why}</p>`:""}</div>`;
  let rows="";
  if(p.t==="sc" && a!=null && w[a]) rows+=`<b>Deine Wahl</b><span>${inl(w[a])}</span>`;
  if(p.t==="multi"){
    const wrongSel=(a||[]).filter(i=>!p.correct.includes(i)), missed=p.correct.filter(i=>!(a||[]).includes(i));
    wrongSel.forEach(i=>{ rows+=`<b>Falsch angekreuzt</b><span>${inl(p.q.o[i])}${w[i]?`: ${inl(w[i])}`:""}</span>`; });
    if(missed.length) rows+=`<b>Gefehlt hat</b><span>${missed.map(i=>inl(p.q.o[i])).join("; ")}</span>`;
  }
  if(p.t==="zahl" && typeof q.w==="string") rows+=`<b>Typischer Fehler</b><span>${inl(q.w)}</span>`;
  if(p.t!=="multi") rows+=right;
  if(why) rows+=`<b>${rows.includes("Deine Wahl")?"Der Unterschied":"Warum"}</b><span>${why}</span>`;
  return `<div class="fb bad"><p class="fh">Nicht ganz.</p><div class="dlist">${rows}</div></div>`;
}

/* ===== Lern-Tracker =====
   Lernzeit zählt nur zwischen zwei Aktionen (Antwort, Karte, Tippen), die höchstens 2 Minuten auseinanderliegen.
   Längere Pausen zählen nicht. Nach 15 Minuten ohne Aktion beginnt eine neue Lernsitzung. */
const IDLE=120000, NEWSESSION=15*60000;
const dayKey = d => { d=new Date(d); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
function logDay(t){ if(!state.log) state.log={}; const k=dayKey(t); return state.log[k] || (state.log[k]={od:0,soz:0,n:0,r:0,s:0,v:0}); }
function hours(){ if(!state.hours || state.hours.length!==24) state.hours=Array.from({length:24},()=>({t:0,n:0,r:0})); return state.hours; }
function countAnswer(ok){ const now=Date.now(), d=logDay(now), h=hours()[new Date(now).getHours()]; d.n++; h.n++; if(ok){ d.r++; h.r++; } }
function track(course, ok){
  const now=Date.now(), gap=now-(state.lastAct||0);
  if(gap<IDLE){ const sec=Math.round(gap/1000); logDay(now)[course==="soz"?"soz":"od"]+=sec; hours()[new Date(now).getHours()].t+=sec; }
  if(gap>=NEWSESSION) logDay(now).s++;
  state.lastAct=now;
  if(ok!==undefined) countAnswer(ok);
}
function visit(){ const now=Date.now(); if(now-(state.lastVisit||0)>NEWSESSION){ logDay(now).v++; state.lastVisit=now; save(); } }

const fmtMin = sec => { const m=Math.round(sec/60); return m<60 ? m+" Min." : Math.floor(m/60)+" Std. "+(m%60?(m%60)+" Min.":""); };
function bars(vals, labels, title){
  const max=Math.max(1,...vals);
  return `<div class="block"><h3>${title}</h3><div style="display:flex;align-items:flex-end;gap:3px;height:110px">
    ${vals.map((v,i)=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%" title="${labels[i]}: ${fmtMin(v)}">
      <div style="width:100%;background:var(--accent);border-radius:3px 3px 0 0;height:${v?Math.max(3,v/max*100):0}%"></div></div>`).join("")}</div>
    <div style="display:flex;gap:3px;margin-top:4px">${labels.map(l=>`<span class="small muted" style="flex:1;text-align:center;font-size:.68rem">${l}</span>`).join("")}</div></div>`;
}

/* ===== Bereitschaft pro Quiz ===== */
function readiness(z){
  const have=z.s.filter(n=>sessions()[n]);
  const items=allQ().concat(allK()).filter(x=>z.s.includes(Number(x.s)));
  const sure=items.length?Math.round(items.filter(x=>boxOf(x.id)>=4).length/items.length*100):0;
  const sims=state.quizzes.filter(q=>q.scope==="q"+z.n).slice(-3), good=sims.filter(q=>q.score>=9).length;
  const ready = have.length===z.s.length && sure>=70 && sims.length===3 && good===3;
  return {have, sure, good, ready, empty:!have.length};
}
function readinessBlock(){
  return `<div class="block"><h3>Bereit fürs echte Quiz?</h3>
    <p class="small muted">Jedes Quiz kannst du nur einmal schreiben, Abgabe für alle bis 21.02.2027. „Bereit“ heißt: Der Stoff ist komplett in der App, mindestens 70&nbsp;% sitzen sicher, und die letzten drei Simulationen hatten jeweils mindestens 9 von 12.</p>
    ${QUIZZES.map(z=>{ const r=readiness(z);
      if(r.empty) return `<div class="review"><strong>Quiz ${z.n}</strong> <span class="small muted">· Sitzung ${z.s[0]}–${z.s[z.s.length-1]} · noch keine Inhalte</span></div>`;
      return `<div class="review"><div class="row"><strong class="grow">Quiz ${z.n}</strong><span class="small" style="color:var(--${r.ready?"good":"muted"});font-weight:600">${r.ready?"Bereit":"Noch nicht"}</span></div>
        <p class="small" style="margin:4px 0 0">${r.have.length===z.s.length?"✓":"○"} Inhalte: ${r.have.length} von ${z.s.length} Sitzungen in der App</p>
        <p class="small" style="margin:2px 0 0">${r.sure>=70?"✓":"○"} Sicher: ${r.sure}&nbsp;% (Ziel 70&nbsp;%)</p>
        <p class="small" style="margin:2px 0 0">${r.good===3?"✓":"○"} Simulationen mit mind. 9 Punkten: ${r.good} von 3</p></div>`; }).join("")}

}
